<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 手机浏览器地址栏颜色也跟着系统走（无开关） -->
<meta name="theme-color" media="(prefers-color-scheme:light)" content="#f5f5f7">
<meta name="theme-color" media="(prefers-color-scheme:dark)" content="#101013">
<title>模型接口兼容性测试</title>
<style>
  /* ============================================================================
     颜色令牌：浅色为基准值，深色覆盖统一放在文件末尾的
     @media screen and (prefers-color-scheme:dark) 里 —— 全站配色只认这里的变量，
     禁止在具体规则里写死颜色，否则深色模式会漏掉那一处。
     color-scheme 让浏览器自绘的部分（滚动条、数字输入框的上下箭头、
     原生控件、表单自动填充）也跟着系统走。
     ============================================================================ */
  :root{
    color-scheme:light dark;

    /* Surface layers - 苹果风格的浅色分层 */
    --surface-0:#f5f5f7;
    --surface-1:#ffffff;
    --surface-2:#fbfbfd;
    --surface-3:#f5f5f7;
    --surface-4:#e8e8ed;
    --field-bg:#ffffff;      /* 输入框/文本域的填充，深色下比面板亮一档 */
    --overlay:rgba(0,0,0,.4);

    /* Accent - 苹果蓝 */
    --accent:#007aff;
    --accent-hover:#0051d5;
    --accent-deep:#004fc6;
    --accent-glow:rgba(0,122,255,.15);
    --accent-soft:rgba(0,122,255,.06);
    --on-accent:#ffffff;     /* 铺满强调色的元素（按钮/选中框/步骤圆点）上的文字 */

    /* Text */
    --text:#1d1d1f;
    --text-dim:#6e6e73;
    --text-faint:#86868b;
    --text-ghost:#d2d2d7;

    /* Status colors */
    --ok:#34c759;
    --ok-dim:#28a745;
    --ok-bg:rgba(52,199,89,.08);
    --warn:#ff9500;
    --warn-dim:#ff8800;
    --warn-bg:rgba(255,149,0,.08);
    --err:#ff3b30;
    --err-dim:#ff2d20;
    --err-bg:rgba(255,59,48,.08);
    --neutral:#8e8e93;
    --neutral-bg:rgba(142,142,147,.08);

    /* Status borders - 状态胶囊/提示条的 1px 边线 */
    --accent-line:rgba(0,122,255,.15);
    --ok-line:rgba(52,199,89,.15);
    --warn-line:rgba(255,149,0,.15);
    --err-line:rgba(255,59,48,.15);
    --neutral-line:rgba(142,142,147,.15);

    /* Borders */
    --border:rgba(0,0,0,.08);
    --border-soft:rgba(0,0,0,.04);
    --border-strong:rgba(0,0,0,.12);

    /* 字号体系：全站只用四档，不要再新增第五档
       ┌ 12px  辅助 提示 / 路径 / 标签 / 表头 / 脚注 / 代码
       ├ 14px  正文 正文 / 字段标签 / 输入框 / 按钮 / 表格内容
       ├ 18px  小标题 区块标题 / 弹层标题 / 提示条图标
       └ 22px  大标题 面板标题 / 统计数值 */
    --fs-sm:12px;
    --fs-base:14px;
    --fs-lg:18px;
    --fs-xl:22px;

    /* Line heights */
    --lh-tight:1.38;
    --lh:1.47;
    --lh-loose:1.6;

    /* Font weights - 苹果风格字重 */
    --fw:400;
    --fw-medium:500;
    --fw-semi:590;
    --fw-bold:700;

    /* Border radius - 苹果风格圆角 */
    --r-xs:4px;
    --r-sm:8px;
    --r-md:12px;
    --r-lg:18px;
    --r-xl:28px;
    --r-pill:980px;

    /* Spacing scale */
    --space-xs:6px;
    --space-sm:12px;
    --space-md:20px;
    --space-lg:32px;
    --space-xl:48px;

    /* Shadows - 苹果风格轻盈阴影 */
    --shadow-xs:0 1px 1px rgba(0,0,0,.04);
    --shadow-sm:0 2px 4px rgba(0,0,0,.04);
    --shadow:0 2px 16px rgba(0,0,0,.06);
    --shadow-lg:0 8px 24px rgba(0,0,0,.08);
    --shadow-xl:0 12px 48px rgba(0,0,0,.12);

    --mono:'SF Mono',ui-monospace,Menlo,Monaco,Consolas,monospace;
    --system:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue','PingFang SC','Hiragino Sans GB',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0}
  html,body{margin:0;padding:0;height:100%}
  html{font-size:16px}
  body{
    background:var(--surface-0);
    color:var(--text);
    font-family:var(--system);
    font-size:var(--fs-base);
    font-weight:var(--fw);
    line-height:var(--lh);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    letter-spacing:-.011em;
  }
  .wrap{max-width:980px;margin:0 auto;padding:clamp(24px,4vw,32px) clamp(20px,4vw,32px) 48px}

  /* ================= 页头 ================= */
  header{margin-bottom:0}

  /* ================= 面板 ================= */
  .panel{
    background:var(--surface-1);
    border:1px solid var(--border);
    border-radius:var(--r-xl);
    padding:clamp(28px,4vw,40px);
    margin-top:var(--space-lg);
    box-shadow:var(--shadow);
  }
  .panel-title{
    font-size:var(--fs-xl);
    font-weight:var(--fw-semi);
    margin:0 0 var(--space-xl);
    display:flex;
    align-items:center;
    gap:var(--space-md);
    letter-spacing:-.02em;
    color:var(--text);
  }
  .panel-title .step{
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--accent);
    color:var(--on-accent);
    font-size:var(--fs-base);
    font-weight:var(--fw-bold);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }

  /* ================= 表单 ================= */
  label.fld{display:block;margin-bottom:var(--space-lg)}
  label.fld > span{
    display:block;
    font-size:var(--fs-base);
    font-weight:var(--fw-semi);
    color:var(--text);
    margin-bottom:var(--space-sm);
    letter-spacing:-.01em;
  }
  input[type=text],input[type=password],input[type=number],textarea,select{
    width:100%;
    padding:11px 14px;
    border:1px solid var(--border-strong);
    border-radius:var(--r-md);
    background:var(--field-bg);
    color:var(--text);
    font-size:var(--fs-base);
    font-family:inherit;
    line-height:var(--lh-tight);
    transition:all .2s ease;
    outline:none;
  }
  input:hover,textarea:hover,select:hover{
    border-color:var(--text-ghost);
  }
  input:focus,textarea:focus,select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 4px var(--accent-glow);
  }
  textarea{
    font-family:var(--mono);
    font-size:var(--fs-sm);
    resize:vertical;
    min-height:120px;
    line-height:var(--lh-loose);
  }
  .mono{font-family:var(--mono)}

  /* 并排字段组：间距完全由 grid gap 控制。
     手机端堆叠时若沿用 label.fld 的 32px 下外边距，会与 gap 叠加成 52px，故在组内归零，
     组的整体下间距用 margin-bottom 补回，保证与勾选框之间仍是 --space-lg。 */
  .row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:var(--space-md);
    margin-bottom:var(--space-lg);
  }
  .row > .fld{margin-bottom:0}

  .hint{
    font-size:var(--fs-sm);
    color:var(--text-faint);
    margin-top:var(--space-sm);
    line-height:var(--lh);
  }
  .hint.mid{margin-top:var(--space-md)}
  .hint.blank{padding:var(--space-lg) 0}
  .hint code{
    font-family:var(--mono);
    background:var(--surface-3);
    color:var(--accent);
    padding:2px 6px;
    border-radius:var(--r-xs);
    font-weight:var(--fw-medium);
  }

  .key-wrap{position:relative}
  .key-wrap input{padding-right:72px}
  .key-toggle{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:transparent;
    color:var(--accent);
    font-size:var(--fs-sm);
    font-weight:var(--fw-medium);
    cursor:pointer;
    padding:6px 10px;
    border-radius:var(--r-sm);
    font-family:inherit;
    transition:all .2s;
  }
  .key-toggle:hover{
    background:var(--accent-soft);
  }

  /* ================= 协议选择 ================= */
  .proto-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:var(--space-md);
    margin-bottom:var(--space-md);
    flex-wrap:wrap;
  }
  .proto-head .lbl{
    font-size:var(--fs-base);
    font-weight:var(--fw-semi);
    color:var(--text);
  }
  .proto-tools{display:flex;gap:var(--space-sm)}
  .link-btn{
    border:1px solid var(--border-strong);
    background:var(--surface-1);
    color:var(--text-dim);
    font-size:var(--fs-sm);
    font-weight:var(--fw-medium);
    padding:6px 14px;
    border-radius:var(--r-pill);
    cursor:pointer;
    font-family:inherit;
    transition:all .2s ease;
  }
  .link-btn:hover{
    background:var(--surface-3);
    color:var(--text);
    border-color:var(--border-strong);
  }

  .proto-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:var(--space-md);
  }
  .proto{
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    padding:var(--space-md);
    cursor:pointer;
    user-select:none;
    background:var(--surface-1);
    transition:all .2s ease;
  }
  .proto:hover{
    border-color:var(--border-strong);
    box-shadow:var(--shadow-sm);
    transform:translateY(-1px);
  }
  .proto.on{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .proto .p-top{display:flex;align-items:flex-start;gap:var(--space-sm)}
  .proto .p-box{
    width:20px;
    height:20px;
    border-radius:var(--r-xs);
    border:1.5px solid var(--border-strong);
    flex:0 0 auto;
    margin-top:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:var(--fs-sm);
    color:var(--accent);
    line-height:1;
    transition:all .2s;
  }
  .proto.on .p-box{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--on-accent);
  }
  .proto .p-name{
    font-size:var(--fs-base);
    font-weight:var(--fw-semi);
    flex:1 1 auto;
    min-width:0;
    overflow-wrap:break-word;
    color:var(--text);
  }
  .proto .p-path{
    font-family:var(--mono);
    font-size:var(--fs-sm);
    color:var(--text-faint);
    margin-top:var(--space-xs);
    word-break:break-all;
    line-height:var(--lh-tight);
  }
  .proto .p-desc{
    font-size:var(--fs-sm);
    color:var(--text-dim);
    margin-top:var(--space-xs);
    line-height:var(--lh);
  }
  .proto .p-tag{
    flex:0 0 auto;
    margin-left:auto;
    font-size:var(--fs-sm);
    font-weight:var(--fw-semi);
    padding:3px 8px;
    border-radius:var(--r-pill);
    background:var(--neutral-bg);
    color:var(--neutral);
    line-height:var(--lh-tight);
  }
  .proto.on .p-tag{
    background:var(--accent);
    color:var(--on-accent);
  }

  /* ================= 按钮 ================= */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:var(--space-sm);
    padding:12px 24px;
    border-radius:var(--r-pill);
    border:none;
    font-size:var(--fs-base);
    font-weight:var(--fw-semi);
    font-family:inherit;
    cursor:pointer;
    line-height:var(--lh-tight);
    transition:all .2s ease;
  }
  .btn-primary{
    background:var(--accent);
    color:var(--on-accent);
    width:100%;
    margin-top:var(--space-md);
  }
  .btn-primary:hover:not(:disabled){
    background:var(--accent-hover);
    transform:scale(0.99);
  }
  .btn-primary:active:not(:disabled){
    transform:scale(0.97);
  }
  .btn-primary:disabled{
    opacity:.4;
    cursor:not-allowed;
  }
  .btn-ghost{
    background:var(--surface-1);
    border:1px solid var(--border-strong);
    color:var(--text);
    padding:7px 16px;
    font-size:var(--fs-sm);
  }
  .btn-ghost:hover{
    background:var(--surface-3);
    border-color:var(--border-strong);
  }

  /* 勾选框 = 协议卡片里 .p-box 的同款：同尺寸、同圆角、同描边、同蓝色填充、
     同一个 ✓ 字形；左边界也退到卡片内容线上（卡片 1px 边框 + 20px 内边距） */
  .chk{
    position:relative;
    display:flex;
    align-items:flex-start;
    gap:var(--space-sm);
    padding-left:calc(1px + var(--space-md));
    margin-bottom:var(--space-md);
    color:var(--text);
    cursor:pointer;
    user-select:none;
  }
  .chk input{
    position:absolute;
    width:1px;
    height:1px;
    margin:0;
    padding:0;
    border:0;
    opacity:0;
    pointer-events:none;
  }
  .chk .cbox{
    flex:0 0 auto;
    width:20px;
    height:20px;
    margin-top:1px;
    border:1.5px solid var(--border-strong);
    border-radius:var(--r-xs);
    background:var(--surface-1);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:var(--fs-sm);
    line-height:1;
    color:transparent;
    transition:all .2s;
  }
  .chk input:checked + .cbox{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--on-accent);
  }
  .chk input:focus-visible + .cbox{
    box-shadow:0 0 0 4px var(--accent-glow);
  }
  .chk .ctxt{
    font-size:var(--fs-base);
    font-weight:var(--fw-semi);
    color:var(--text);
  }

  details.adv{
    margin:var(--space-lg) 0 0;
    border-top:1px solid var(--border);
    padding-top:var(--space-md);
  }
  details.adv summary{
    cursor:pointer;
    font-size:var(--fs-base);
    font-weight:var(--fw-semi);
    color:var(--text);
    list-style:none;
    display:flex;
    align-items:center;
    gap:var(--space-xs);
    transition:color .2s;
    padding:var(--space-sm) 0;
  }
  details.adv summary:hover{color:var(--accent)}
  details.adv summary::-webkit-details-marker{display:none}
    details.adv summary::before{
      content:"›";
      transition:transform .2s;
      display:inline-block;
      font-size:var(--fs-lg);
    color:var(--text-dim);
    font-weight:var(--fw-bold);
    line-height:1;
  }
  details.adv[open] summary::before{transform:rotate(90deg)}
  details.adv .inner{padding-top:var(--space-md)}

  /* ================= 提示条 ================= */
  .banner{
    padding:var(--space-md) var(--space-lg);
    border-radius:var(--r-lg);
    font-size:var(--fs-base);
    margin-bottom:var(--space-lg);
    border:1px solid transparent;
    display:flex;
    gap:var(--space-md);
    align-items:flex-start;
    line-height:var(--lh);
  }
  .banner .ico{
    flex:0 0 auto;
    font-size:var(--fs-lg);
    line-height:1;
  }
  .banner.info{
    background:var(--accent-soft);
    border-color:var(--accent-line);
    color:var(--accent-hover);
  }
  .banner.ok{
    background:var(--ok-bg);
    border-color:var(--ok-line);
    color:var(--ok-dim);
  }
  .banner.warn{
    background:var(--warn-bg);
    border-color:var(--warn-line);
    color:var(--warn-dim);
  }
  .banner.err{
    background:var(--err-bg);
    border-color:var(--err-line);
    color:var(--err-dim);
  }
  .banner code{
    font-family:var(--mono);
    font-size:var(--fs-sm);
    background:var(--surface-3);
    color:var(--accent);
    padding:2px 6px;
    border-radius:var(--r-xs);
    font-weight:var(--fw-medium);
  }

  /* ================= 统计 ================= */
  .stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:var(--space-md);
    margin-bottom:var(--space-lg);
  }
  .stat{
    background:var(--surface-1);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    padding:var(--space-md) var(--space-lg);
    transition:all .2s;
  }
  .stat:hover{
    border-color:var(--border-strong);
    box-shadow:var(--shadow-sm);
  }
  .stat .k{
    font-size:var(--fs-sm);
    color:var(--text-faint);
    font-weight:var(--fw-medium);
    margin-bottom:var(--space-xs);
  }
  .stat .v{
    font-size:var(--fs-xl);
    font-weight:var(--fw-bold);
    letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
    line-height:var(--lh-tight);
    color:var(--text);
  }
  .stat.ok .v{color:var(--ok)}
  .stat.err .v{color:var(--err)}

  .bar{
    height:6px;
    border-radius:var(--r-pill);
    background:var(--surface-3);
    overflow:hidden;
    margin:var(--space-md) 0 var(--space-sm);
  }
  .bar > i{
    display:block;
    height:100%;
    background:var(--accent);
    width:0;
    border-radius:var(--r-pill);
    transition:width .4s ease;
  }

  .prog-text{
    font-size:var(--fs-sm);
    color:var(--text-dim);
    display:flex;
    justify-content:space-between;
    font-variant-numeric:tabular-nums;
  }

  /* ================= 矩阵表 ================= */
  .matrix-scroll{
    overflow-x:auto;
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    background:var(--surface-1);
  }
  table.matrix{
    border-collapse:separate;
    border-spacing:0;
    font-size:var(--fs-sm);
    width:100%;
  }
  table.matrix th,table.matrix td{
    padding:12px 16px;
    border-bottom:1px solid var(--border-soft);
    text-align:left;
    vertical-align:middle;
  }
  table.matrix thead th{
    background:var(--surface-2);
    font-size:var(--fs-sm);
    font-weight:var(--fw-semi);
    color:var(--text-faint);
    white-space:nowrap;
    border-bottom:1px solid var(--border);
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  table.matrix thead th.ph{
    white-space:normal;
    vertical-align:bottom;
    line-height:var(--lh-tight);
  }
  table.matrix tbody tr:last-child td{border-bottom:none}
  table.matrix tbody tr{transition:background .15s ease}
  table.matrix tbody tr:hover{background:var(--surface-2)}
  table.matrix td.mh{
    position:sticky;
    left:0;
    background:var(--surface-1);
    z-index:1;
    font-family:var(--mono);
    font-size:var(--fs-sm);
    font-weight:var(--fw-medium);
    word-break:break-all;
    min-width:200px;
    border-right:1px solid var(--border);
    color:var(--text);
  }
  table.matrix tbody tr:hover td.mh{background:var(--surface-2)}
  table.matrix thead th.mh{
    position:sticky;
    left:0;
    z-index:3;
    background:var(--surface-2);
    border-right:1px solid var(--border);
  }

  .mcell{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 12px;
    border-radius:var(--r-pill);
    font-size:var(--fs-sm);
    font-weight:var(--fw-semi);
    white-space:nowrap;
    cursor:pointer;
    border:1px solid transparent;
    line-height:var(--lh-tight);
    transition:all .15s ease;
  }
  .mcell.plain{
    background:transparent;
    color:var(--text-ghost);
    cursor:default;
  }
  .mcell.ok{
    background:var(--ok-bg);
    color:var(--ok-dim);
    border-color:var(--ok-line);
  }
  .mcell.ok:hover{
    border-color:var(--ok);
    box-shadow:0 2px 8px var(--ok-line);
  }
  .mcell.warn{
    background:var(--warn-bg);
    color:var(--warn-dim);
    border-color:var(--warn-line);
  }
  .mcell.warn:hover{
    border-color:var(--warn);
    box-shadow:0 2px 8px var(--warn-line);
  }
  .mcell.err{
    background:var(--err-bg);
    color:var(--err-dim);
    border-color:var(--err-line);
  }
  .mcell.err:hover{
    border-color:var(--err);
    box-shadow:0 2px 8px var(--err-line);
  }
  .mcell.neutral{
    background:var(--neutral-bg);
    color:var(--neutral);
    border-color:var(--neutral-line);
  }
  .mcell.neutral:hover{
    border-color:var(--neutral);
  }
  .mcell .ms{
    font-weight:var(--fw);
    opacity:.7;
    font-variant-numeric:tabular-nums;
  }

  .declared{
    font-size:var(--fs-sm);
    color:var(--text-faint);
    font-family:var(--mono);
    white-space:nowrap;
    line-height:var(--lh-tight);
  }
  .declared.mismatch{
    color:var(--warn);
    font-weight:var(--fw-semi);
  }

  .legend{
    display:flex;
    gap:var(--space-lg);
    flex-wrap:wrap;
    font-size:var(--fs-sm);
    color:var(--text-dim);
    margin:var(--space-md) 0 var(--space-xs);
  }
  .legend span{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .legend i{
    width:10px;
    height:10px;
    border-radius:50%;
    display:inline-block;
  }

  /* ================= 报告 ================= */
  .report h3{
    font-size:var(--fs-lg);
    font-weight:var(--fw-semi);
    margin:var(--space-xl) 0 var(--space-md);
    letter-spacing:-.015em;
    color:var(--text);
  }
  .report h3:first-child{margin-top:0}
  .report ul{margin:var(--space-sm) 0;padding-left:var(--space-xl)}
  .report li{
    margin-bottom:var(--space-sm);
    font-size:var(--fs-base);
    color:var(--text-dim);
    line-height:var(--lh);
  }
  .report li b{color:var(--text);font-weight:var(--fw-semi)}
  .report code{
    font-family:var(--mono);
    font-size:var(--fs-sm);
    background:var(--surface-3);
    color:var(--accent);
    padding:2px 6px;
    border-radius:var(--r-xs);
    font-weight:var(--fw-medium);
  }

  .rate-list{
    display:flex;
    flex-direction:column;
    gap:var(--space-sm);
    margin:var(--space-sm) 0 0;
  }
  .rate-row{
    display:flex;
    align-items:center;
    gap:var(--space-md);
    font-size:var(--fs-sm);
  }
  .rate-row .rn{
    width:180px;
    flex:0 0 auto;
    font-family:var(--mono);
    font-size:var(--fs-sm);
    color:var(--text);
  }
  .rate-row .rb{
    flex:1;
    height:6px;
    border-radius:var(--r-pill);
    background:var(--surface-3);
    overflow:hidden;
    min-width:80px;
  }
  .rate-row .rb > i{
    display:block;
    height:100%;
    border-radius:var(--r-pill);
    transition:width .4s ease;
  }
  .rate-row .rv{
    width:100px;
    text-align:right;
    flex:0 0 auto;
    font-variant-numeric:tabular-nums;
    color:var(--text-dim);
    font-size:var(--fs-sm);
    white-space:nowrap;
  }

  table.plain{
    width:100%;
    border-collapse:collapse;
    font-size:var(--fs-sm);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    overflow:hidden;
  }
  table.plain th{
    text-align:left;
    font-size:var(--fs-sm);
    font-weight:var(--fw-semi);
    color:var(--text-faint);
    padding:10px 14px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
    background:var(--surface-2);
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  table.plain td{
    padding:10px 14px;
    border-bottom:1px solid var(--border-soft);
    vertical-align:top;
  }
  table.plain tr:last-child td{border-bottom:none}
  table.plain tbody tr{transition:background .15s ease}
  table.plain tbody tr:hover{background:var(--surface-2)}
  table.plain td.num{
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    color:var(--text-dim);
  }
  table.plain td.lb{
    color:var(--text-faint);
    width:120px;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:4px 10px;
    border-radius:var(--r-pill);
    font-size:var(--fs-sm);
    font-weight:var(--fw-semi);
    white-space:nowrap;
    line-height:var(--lh-tight);
    border:1px solid transparent;
  }
  .badge.ok{background:var(--ok-bg);color:var(--ok-dim);border-color:var(--ok-line)}
  .badge.err{background:var(--err-bg);color:var(--err-dim);border-color:var(--err-line)}
  .badge.warn{background:var(--warn-bg);color:var(--warn-dim);border-color:var(--warn-line)}
  .badge.neutral{background:var(--neutral-bg);color:var(--neutral);border-color:var(--neutral-line)}
  .badge.info{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}

  .model-name{
    font-family:var(--mono);
    font-size:var(--fs-sm);
    font-weight:var(--fw-medium);
    word-break:break-all;
    color:var(--text);
  }
  .note{
    font-size:var(--fs-sm);
    color:var(--text-faint);
    word-break:break-word;
  }
  .note.bad{color:var(--err)}

  .actions{
    display:flex;
    gap:var(--space-sm);
    flex-wrap:wrap;
    margin-top:var(--space-lg);
    padding-top:var(--space-lg);
    border-top:1px solid var(--border);
  }
  .actions.bare{
    border-top:none;
    padding-top:var(--space-lg);
    margin-top:var(--space-sm);
  }

  /* ================= 弹层 ================= */
  .modal{
    position:fixed;
    inset:0;
    background:var(--overlay);
    display:none;
    align-items:center;
    justify-content:center;
    padding:var(--space-lg);
    z-index:50;
    animation:fadeIn .25s ease;
  }
  .modal.on{display:flex}
  .modal .box{
    background:var(--surface-1);
    border:1px solid var(--border);
    border-radius:var(--r-xl);
    padding:var(--space-xl);
    max-width:680px;
    width:100%;
    box-shadow:var(--shadow-xl);
    max-height:85vh;
    overflow:auto;
    animation:slideUp .3s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal h4{
    margin:0 0 var(--space-lg);
    font-size:var(--fs-lg);
    font-weight:var(--fw-semi);
    color:var(--text);
  }
  .kv{
    display:grid;
    grid-template-columns:120px 1fr;
    gap:var(--space-sm) var(--space-lg);
    font-size:var(--fs-sm);
  }
  .kv dt{
    color:var(--text-faint);
    font-weight:var(--fw-semi);
  }
  .kv dd{
    margin:0;
    word-break:break-word;
    color:var(--text-dim);
  }

  .dots::after{content:"";animation:dots 1.2s steps(4,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

  footer{
    margin-top:var(--space-xl);
    padding-top:var(--space-lg);
    font-size:var(--fs-sm);
    color:var(--text-faint);
    text-align:center;
    border-top:1px solid var(--border);
  }

  /* ============================================================================
     深色模式：完全跟随系统，没有开关（改系统外观即可，无需刷新以外的操作）。
     只覆盖颜色令牌，不碰布局；未在这里列出的令牌沿用上面的浅色值。
     深色的层次逻辑与浅色同构 —— 浅色是「越高层越白」，深色就是「越高层越亮」，
     所以 --surface-0 → 1 → 2 → 3 在深色下是一条由暗到亮的灰阶。
     用 screen 限定是为了让 @media print 走浅色，避免深色系统下打印出灰底浅字。
     ============================================================================ */
  @media screen and (prefers-color-scheme:dark){
    :root{
      /* 表面层：页面底 → 面板 → 表头/悬停 → 代码块/进度槽 */
      --surface-0:#101013;
      --surface-1:#1c1c1f;
      --surface-2:#26262a;
      --surface-3:#313137;
      --field-bg:#26262a;          /* 比面板亮一档，输入框才看得出是个「框」 */
      --overlay:rgba(0,0,0,.62);   /* 深色下遮罩要更重才有「压住」的感觉 */

      /* 强调色：iOS 深色系统蓝；悬停变为提亮（浅色下是加深） */
      --accent:#0a84ff;
      --accent-hover:#409cff;
      --accent-deep:#409cff;
      --accent-glow:rgba(10,132,255,.35);
      --accent-soft:rgba(10,132,255,.16);

      /* 文本：深底上整体提亮，保持与浅色同等的对比层级 */
      --text:#f5f5f7;
      --text-dim:#b4b4bd;
      --text-faint:#8e8e96;
      --text-ghost:#4c4c53;        /* 输入框悬停描边 / 「协议不支持」的空心格 */

      /* 状态色：深色下用更亮的一档，否则深底上的绿/橙/红会发闷 */
      --ok:#30d158;
      --ok-dim:#3ddc6b;
      --ok-bg:rgba(48,209,88,.16);
      --warn:#ff9f0a;
      --warn-dim:#ffb340;
      --warn-bg:rgba(255,159,10,.16);
      --err:#ff453a;
      --err-dim:#ff6961;
      --err-bg:rgba(255,69,58,.16);
      --neutral:#98989d;
      --neutral-bg:rgba(152,152,157,.16);

      /* 状态描边与悬停光晕（光晕复用描边色，见 .mcell.*:hover） */
      --accent-line:rgba(10,132,255,.40);
      --ok-line:rgba(48,209,88,.30);
      --warn-line:rgba(255,159,10,.30);
      --err-line:rgba(255,69,58,.32);
      --neutral-line:rgba(152,152,157,.26);

      /* 描边：深色下必须用白（浅色下是黑），否则边界会「消失」 */
      --border:rgba(255,255,255,.10);
      --border-soft:rgba(255,255,255,.06);
      --border-strong:rgba(255,255,255,.18);

      /* 阴影：深底上的黑阴影要加重，卡片才浮得起来 */
      --shadow-xs:0 1px 2px rgba(0,0,0,.4);
      --shadow-sm:0 2px 8px rgba(0,0,0,.45);
      --shadow:0 4px 24px rgba(0,0,0,.5);
      --shadow-lg:0 10px 32px rgba(0,0,0,.55);
      --shadow-xl:0 18px 60px rgba(0,0,0,.65);
      /* --on-accent 保持白色（深色下按钮/选中框仍是蓝底白字） */
    }
  }

  @media(max-width:768px){
    .wrap{padding:clamp(24px,5vw,32px) clamp(16px,3vw,20px) 64px}
    header{text-align:left}
    .row{grid-template-columns:1fr}
    .stat-grid{grid-template-columns:repeat(2,1fr)}
    .proto-grid{grid-template-columns:1fr}
    .rate-row .rn{width:100px}
    .rate-row .rv{width:70px;font-size:var(--fs-sm)}
    .kv{grid-template-columns:90px 1fr;gap:var(--space-xs) var(--space-sm)}
  }
  @media print{
    :root{color-scheme:light}      /* 打印固定走浅色，不被系统深色带跑 */
    body{background:#ffffff}
    .panel{box-shadow:none;break-inside:avoid}
    #panel-config,.actions,.link-btn{display:none !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
  </header>

  <!-- ============ 1. 配置 ============ -->
  <section class="panel" id="panel-config">
    <h2 class="panel-title"><span class="step">1</span>接口配置</h2>

    <label class="fld">
      <span>接口地址</span>
      <input type="text" id="baseUrl" class="mono" placeholder="https://your-relay.com" autocomplete="off" spellcheck="false">
      <div class="hint">填站点根地址即可（如 <code class="mono">https://e-flowcode.cc</code>），带不带 <code class="mono">/v1</code> 都行，各协议路径会自动补全。</div>
    </label>

    <label class="fld">
      <span>API Key</span>
      <div class="key-wrap">
        <input type="password" id="apiKey" class="mono" placeholder="sk-..." autocomplete="off" spellcheck="false">
        <button class="key-toggle" id="keyToggle" type="button">显示</button>
      </div>
      <div class="hint">Key 只保存在你的浏览器中，不会上传到任何服务器。</div>
    </label>

    <div class="proto-head">
      <span class="lbl">兼容模式（可多选，会按「模型 × 协议」交叉实测）</span>
      <span class="proto-tools">
        <button class="link-btn" id="pMain" type="button">选主流三种</button>
        <button class="link-btn" id="pAll" type="button">全选</button>
        <button class="link-btn" id="pNone" type="button">清空</button>
      </span>
    </div>
    <div class="proto-grid" id="protoGrid"></div>

    <label class="fld" id="customWrap" style="display:none;margin-top:14px">
      <span>自定义协议地址（原样请求，不做路径补全）</span>
      <input type="text" id="customUrl" class="mono" placeholder="https://your-relay.com/v1/chat/completions" autocomplete="off" spellcheck="false">
    </label>

    <details class="adv">
      <summary>高级设置</summary>
      <div class="inner">
        <div class="row">
          <label class="fld">
            <span>并发数</span>
            <input type="number" id="concurrency" value="6" min="1" max="20">
            <div class="hint">建议 5～8</div>
          </label>
          <label class="fld">
            <span>单请求超时（秒）</span>
            <input type="number" id="timeout" value="30" min="5" max="180">
            <div class="hint">慢站可调到 60</div>
          </label>
          <label class="fld">
            <span>失败重试次数</span>
            <input type="number" id="retries" value="1" min="0" max="3">
            <div class="hint">仅对超时/网络错误重试</div>
          </label>
        </div>
        <label class="chk">
          <input type="checkbox" id="rememberKey">
          <span class="cbox">✓</span>
          <span class="ctxt">记住 API Key</span>
        </label>
        <label class="chk">
          <input type="checkbox" id="filterDeclared">
          <span class="cbox">✓</span>
          <span class="ctxt">只测服务端声明支持的协议</span>
        </label>
        <label class="chk">
          <input type="checkbox" id="manualMode">
          <span class="cbox">✓</span>
          <span class="ctxt">手动指定模型清单</span>
        </label>
        <label class="fld" id="manualWrap" style="display:none">
          <span>模型清单（每行一个）</span>
          <textarea id="manualModels" class="mono" placeholder="deepseek-v4.1-flash&#10;glm-5.3&#10;kimi-k2.5"></textarea>
        </label>
      </div>
    </details>

    <button class="btn btn-primary" id="runBtn">开始测试</button>
  </section>

  <!-- ============ 2. 连通性 ============ -->
  <section class="panel" id="panel-conn" style="display:none">
    <h2 class="panel-title"><span class="step">2</span>接口连通性与模型清单</h2>
    <div id="connResult"></div>
  </section>

  <!-- ============ 3. 矩阵 ============ -->
  <section class="panel" id="panel-models" style="display:none">
    <h2 class="panel-title"><span class="step">3</span>跨协议实测矩阵</h2>
    <div class="stat-grid" id="stats"></div>
    <div class="bar"><i id="progBar"></i></div>
    <div class="prog-text">
      <span id="progLabel">准备中<span class="dots"></span></span>
      <span id="progCount">0 / 0</span>
    </div>
    <div id="tableWrap" style="margin-top:14px"></div>
    <div class="legend" id="legend"></div>
    <div class="actions" id="resultActions" style="display:none">
      <button class="btn btn-ghost" id="onlyOk">只看可用协议</button>
      <button class="btn btn-ghost" id="retestFail">重测失败项</button>
    </div>
  </section>

  <!-- ============ 4. 报告 ============ -->
  <section class="panel report" id="panel-report" style="display:none">
    <h2 class="panel-title"><span class="step">4</span>测试报告</h2>
    <div id="reportBody"></div>
    <div class="actions" id="reportActions" style="display:none">
      <button class="btn btn-ghost" id="expHtml">导出报告（HTML）</button>
      <button class="btn btn-ghost" id="expMd">导出报告（Markdown）</button>
      <button class="btn btn-ghost" id="expJson">导出原始数据（JSON）</button>
      <button class="btn btn-ghost" id="expCsv">导出矩阵（CSV）</button>
    </div>
  </section>

  <footer>
    纯前端实现 · 不经过任何中间服务器 · 你的 Key 只留在本机浏览器
  </footer>
</div>

<!-- 详情弹层 -->
<div class="modal" id="modal">
  <div class="box">
    <h4 id="modalTitle">明细</h4>
    <dl class="kv" id="modalBody"></dl>
    <div class="actions bare">
      <button class="btn btn-ghost" id="modalClose">关闭</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ==================================================================
     常量
     ================================================================== */
  var LS_KEY = "mat.config.v2";
  var PROBE_INSTRUCTION = "Reply with OK.";
  var PROBE_MAX_TOKENS = 512;
  var ANTHROPIC_VERSION = "2023-06-01";
  var AZURE_API_VERSION = "2024-02-01";

  /* 测速档的两个上限：收满这么多块、或首块之后再过这么久，就断开。
     两者都是为了让「输出速度」有个可比的采样窗口 —— 窗口太小会被首字后的
     停顿带偏，太大又白烧额度。 */
  var METER_MAX_CHUNKS = 64;
  var METER_MAX_MS = 6000;

  /* 「每格采样次数」和「探测模式」不做成界面控件 —— 页面上不放这两项。
     默认就是 1 次采样、快速档（零额外请求、零额外额度）；
     要下更硬的结论时用地址栏参数临时打开：
       ?samples=3        同一格连打 3 次，延迟取中位、状态取众数
       ?meter=1          测速档：收满采样窗口再断开，算出真实吐字速度
     两者都会成倍消耗请求与额度，所以不设为默认。 */
  var probeSettings = (function () {
    var q = {};
    try {
      String(location.search || "").replace(/^\?/, "").split("&").forEach(function (kv) {
        if (!kv) return;
        var i = kv.indexOf("=");
        var k = i < 0 ? kv : kv.slice(0, i);
        var v = i < 0 ? "" : kv.slice(i + 1);
        try { q[decodeURIComponent(k)] = decodeURIComponent(v); } catch (e) { q[k] = v; }
      });
    } catch (e) { q = {}; }
    return {
      samples: Math.max(1, Math.min(5, Number(q.samples) || 1)),
      metering: /^(1|true|yes|on)$/i.test(String(q.meter == null ? "" : q.meter))
    };
  })();

  var STATUS = {
    OK:          { key: "OK",          label: "可用",       cls: "ok",      rank: 0, ok: true  },
    WARN:        { key: "WARN",        label: "可用·降级",  cls: "warn",    rank: 1, ok: true  },
    TIMEOUT:     { key: "TIMEOUT",     label: "超时",       cls: "warn",    rank: 2, ok: false },
    RATELIMIT:   { key: "RATELIMIT",   label: "限流/欠费",  cls: "warn",    rank: 3, ok: false },
    NOCHANNEL:   { key: "NOCHANNEL",   label: "无可用渠道", cls: "warn",    rank: 4, ok: false },
    NOTFOUND:    { key: "NOTFOUND",    label: "模型不存在", cls: "err",     rank: 5, ok: false },
    UNSUPPORTED: { key: "UNSUPPORTED", label: "协议不支持", cls: "neutral", rank: 6, ok: false },
    UNAUTH:      { key: "UNAUTH",      label: "Key 无效",   cls: "err",     rank: 7, ok: false },
    NETWORK:     { key: "NETWORK",     label: "网络/CORS",  cls: "err",     rank: 8, ok: false },
    SERVER:      { key: "SERVER",      label: "服务异常",   cls: "err",     rank: 9, ok: false },
    UNKNOWN:     { key: "UNKNOWN",     label: "未知",       cls: "neutral", rank:10, ok: false }
  };

  /* ==================================================================
     协议注册表
     每种协议 = 一套「鉴权 + 路径 + 请求体 + 响应判定 + 正文提取」
     ================================================================== */

  function okOpenai(o) {
    return Array.isArray(o.choices) || (o.object && /chat\.completion/.test(String(o.object)));
  }
  function textOpenai(o) {
    try {
      var c = o.choices && o.choices[0];
      var m = c && (c.message || c.delta);
      return (m && m.content) || "";
    } catch (e) { return ""; }
  }
  function okOpenaiResp(o) {
    if (o.object === "response") return true;
    return typeof o.type === "string" && o.type.indexOf("response.") === 0;
  }
  function textOpenaiResp(o) {
    try {
      if (o.type === "response.output_text.delta") return o.delta || "";
      if (Array.isArray(o.output)) {
        var s = "";
        o.output.forEach(function (item) {
          if (Array.isArray(item.content)) item.content.forEach(function (c) { if (c.text) s += c.text; });

    u = u.replace(/^(https?:\/\/)(?:https?:\/\/)+/i, "$1");

    if (!m) return null;
    var origin = m[1];
    var rest = m[2] || "";

    if (!rest || rest === "/") {
      roots.push(origin + "/v1");
      roots.push(origin);
    } else {
      roots.push(origin + rest);
      if (!/\/v\d+([a-z]*)?$/i.test(rest)) roots.push(origin + "/v1");
