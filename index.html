    var m = extractErrorMessage(bodyText);
    if (status === 401 || status === 403) return { st: STATUS.UNAUTH, note: m || ("HTTP " + status) };
    if (status === 404) return { st: STATUS.NOTFOUND, note: m || "接口返回 404" };
    if (status === 429) return { st: STATUS.RATELIMIT, note: m || "触发限流或额度不足" };
    if (status === 503 || /无可用渠道|no\s*available\s*channel|distributor/i.test(m)) {
      return { st: STATUS.NOCHANNEL, note: m || "该模型在当前分组下没有可用渠道" };
    }
    if (/not\s*implemented|convert_request_failed|Invalid URL|unsupported|不支持|不适配/i.test(m)
        || /unsupported_endpoint/.test(String(bodyText || ""))) {
      return { st: STATUS.UNSUPPORTED, note: m };
    }
    if (status >= 500) return { st: STATUS.SERVER, note: m || ("HTTP " + status) };
    if (status === 400) {
      if (/not\s*found|不存在|invalid\s*model|不包含|does not exist/i.test(m)) return { st: STATUS.NOTFOUND, note: m };
      return { st: STATUS.UNKNOWN, note: m || "HTTP 400 请求被拒绝" };
    }
    return { st: STATUS.UNKNOWN, note: m || ("HTTP " + status) };
  }

  function parseModelList(kind, data) {
    if (!data || typeof data !== "object") return null;
    var arr = null;
    if (kind === "google" || kind === "ollama") arr = data.models;
    else arr = data.data || data.models;
    if (!Array.isArray(arr)) return null;
    var out = [], seen = {};
    for (var i = 0; i < arr.length; i++) {
      var it = arr[i], id = null, declared = null;
      if (typeof it === "string") id = it;
      else if (it) {
        id = it.id || it.model || it.name || it.displayName;
        if (Array.isArray(it.supported_endpoint_types)) declared = it.supported_endpoint_types;
      }
      if (!id || seen[id]) continue;
      seen[id] = 1;
      out.push({ id: String(id), declared: declared });
    }
    return out;
  }

  /* ==================================================================
     阶段一：拉取模型清单
     ================================================================== */
  async function fetchModelList(nb, key, timeoutMs) {
    var eps = [];
    function add(url, kind, auth) {
      var k = url + "|" + auth;
      for (var i = 0; i < eps.length; i++) if (eps[i]._k === k) return;
      eps.push({ url: url, kind: kind, auth: auth, _k: k });
    }
    nb.roots.forEach(function (r) { add(r + "/models", "openai", "bearer"); });
    add(nb.origin + "/v1/models", "openai", "bearer");
    nb.roots.forEach(function (r) { add(r + "/models", "openai", "anthropic"); });
    add(nb.origin + "/v1beta/models", "google", "google");
    add(nb.origin + "/api/tags", "ollama", "none");

    var fails = [];
    for (var i = 0; i < eps.length; i++) {
      var ep = eps[i];
      var p = { auth: ep.auth };
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, timeoutMs);
      try {
        var res = await fetch(ep.url, {
          method: "GET",
          headers: Object.assign({ "Accept": "application/json" }, authHeaders(p, key)),
          signal: ctrl.signal
        });
        var text = await res.text().catch(function () { return ""; });
        if (!res.ok) {
          if (isHtmlBody(text)) { fails.push({ url: ep.url, st: STATUS.UNSUPPORTED, note: "返回 HTML 页面，非接口" }); continue; }
          var c = classifyHttp(res.status, text);
          fails.push({ url: ep.url, st: c.st, note: c.note });
          if (c.st.key === "UNAUTH") return { ok: false, status: c.st, note: c.note, unauth: true, fails: fails };
          continue;
        }
        if (isHtmlBody(text)) { fails.push({ url: ep.url, st: STATUS.UNSUPPORTED, note: "返回 HTML 页面，非接口" }); continue; }
        var data = null;
        try { data = JSON.parse(text); } catch (e) {
          fails.push({ url: ep.url, st: STATUS.UNKNOWN, note: "返回内容不是合法 JSON" }); continue;
        }
        var list = parseModelList(ep.kind, data);
        if (list === null) { fails.push({ url: ep.url, st: STATUS.UNKNOWN, note: "响应里没有模型数组" }); continue; }
        if (!list.length) { fails.push({ url: ep.url, st: STATUS.UNKNOWN, note: "清单为空" }); continue; }
        return { ok: true, models: list, source: ep.url, fails: fails };
      } catch (err) {
        var aborted = ctrl.signal.aborted;
        fails.push({
          url: ep.url,
          st: aborted ? STATUS.TIMEOUT : STATUS.NETWORK,
          note: aborted ? ("请求超时（" + timeoutMs + "ms）") : "无法连接：网络错误或该服务未开放跨域（CORS）"
        });
        if (!aborted) {
          // 网络层问题（通常是 CORS / 不可达），换路径也一样，直接判定
          return { ok: false, status: STATUS.NETWORK, note: "无法连接：网络错误或该服务未开放跨域（CORS）", failed: true, fails: fails };
        }
      } finally {
        clearTimeout(timer);
      }
    }
    return { ok: false, status: (fails[0] && fails[0].st) || STATUS.UNKNOWN, note: (fails[0] && fails[0].note) || "未找到可用的清单端点", fails: fails };
  }

  /* ==================================================================
     阶段二：单协议单模型探针
     ================================================================== */
  async function probeOneUrl(url, p, body, key, timeoutMs, metering) {
    var ctrl = new AbortController();
    var timedOut = false, finished = false;
    var timer = setTimeout(function () { timedOut = true; ctrl.abort(); }, timeoutMs);
    var t0 = performance.now();
    function ms() { return Math.round(performance.now() - t0); }

    try {
      var headers = Object.assign({
        "Content-Type": "application/json",
        "Accept": "text/event-stream, application/json"
      }, authHeaders(p, key));

      var res = await fetch(url, { method: "POST", headers: headers, body: JSON.stringify(body), signal: ctrl.signal });

      if (!res.ok) {
        var bt = await res.text().catch(function () { return ""; });
        if (isHtmlBody(bt)) {
          return { status: STATUS.UNSUPPORTED, firstTokenMs: null, totalMs: ms(), pathMismatch: true,
                   note: "该路径未实现此协议，被站点前端页面兜底返回了 HTML" };
        }
        var c = classifyHttp(res.status, bt);
        return {
          status: c.st, firstTokenMs: null, totalMs: ms(), note: c.note,
          retryable: res.status >= 500 && c.st.key !== "UNSUPPORTED" && c.st.key !== "NOCHANNEL",
          pathMismatch: res.status === 404
        };
      }

      var ctype = (res.headers.get("content-type") || "").toLowerCase();

      // 站点用 SPA 兜底时，200 也可能是 HTML
      if (ctype.indexOf("text/html") >= 0) {
        await res.text().catch(function () { return ""; });
        return { status: STATUS.UNSUPPORTED, firstTokenMs: null, totalMs: ms(), pathMismatch: true,
                 note: "返回 HTML 页面，说明该路径不是接口" };
      }

      // 非流式 JSON 直接返回
      if (ctype.indexOf("application/json") >= 0) {
        var txt = await res.text().catch(function () { return ""; });
        var parsed = null;
        try { parsed = JSON.parse(txt); } catch (e) {
          return { status: STATUS.UNKNOWN, firstTokenMs: null, totalMs: ms(), note: "响应不是合法 JSON" };
        }
        if (parsed && (parsed.error || parsed.type === "error")) {
          var c2 = classifyHttp(res.status, JSON.stringify(parsed));
          return { status: c2.st, firstTokenMs: null, totalMs: ms(), note: c2.note };
        }
        if (parsed && p.ok(parsed)) {
          var sample = "";
          try { sample = String(p.text(parsed) || "").slice(0, 60); } catch (e) { /* ignore */ }
          return { status: STATUS.OK, firstTokenMs: ms(), totalMs: ms(), note: "非流式响应正常", sample: sample, mode: "非流式" };
        }
        return { status: STATUS.UNKNOWN, firstTokenMs: null, totalMs: ms(), note: "响应结构不符合该协议（未找到预期字段）" };
      }

      if (!res.body || !res.body.getReader) {
        return { status: STATUS.OK, firstTokenMs: ms(), totalMs: ms(), note: "响应正常（无法读取流）", mode: "流式" };
      }

      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buf = "";
      var firstValidMs = null, streamError = null, sawJson = false, sample = "";
      /* 测速档用的计数：首块之后又收到多少块、多少字符、最后一块落在什么时刻。
         分子只算「首块之后」的字符、分母只算「首块之后」的时间 ——
         首块延迟是等待，吐字速度是产出，混在一起会让「首块慢但吐得快」的站吃亏。 */
      var outChunks = 0, outChars = 0, lastChunkMs = null;

      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, { stream: true });

        var stop = false;
        var nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          var line = buf.slice(0, nl).replace(/\r$/, "").trim();
          buf = buf.slice(nl + 1);
          if (!line || line.charAt(0) === ":") continue;

          var payload = null;
          if (line.indexOf("data:") === 0) {
            payload = line.slice(5).trim();
            if (!payload || payload === "[DONE]") continue;
          } else if (line.charAt(0) === "{") {
            payload = line;                       // NDJSON（Ollama）
          } else {
            continue;                             // event: 等行直接跳过
          }

          var obj = null;
          try { obj = JSON.parse(payload); } catch (e) { continue; }
          sawJson = true;

          if (obj && (obj.error || obj.type === "error")) {
            streamError = extractErrorMessage(JSON.stringify(obj)) || "流式响应中返回错误";
            stop = true; break;
          }
          var isGood = p.ok(obj);
          if (firstValidMs === null && isGood) {
            firstValidMs = ms();
            try { sample = String(p.text(obj) || "").slice(0, 60); } catch (e) { /* ignore */ }
            /* 首块已到，剩下的只是收采样窗口：把超时重设成窗口上限 + 余量。
               否则「首块等了 25s，再收 6s」会被 30s 的总超时判成 TIMEOUT。 */
            if (metering) {
              clearTimeout(timer);
              timer = setTimeout(function () { timedOut = true; ctrl.abort(); }, METER_MAX_MS + 3000);
            }
          }
          if (firstValidMs !== null) {
            if (isGood) {
              outChunks++;
              if (outChunks > 1) {
                try { outChars += String(p.text(obj) || "").length; } catch (e) { /* ignore */ }
              }
              lastChunkMs = ms();
            }
            // 快速档：命中首个合法块就断（这就是它「零额外消耗」的全部秘密）；
            // 测速档：继续收，直到块数或时长撞到上限
            var windowFull = outChunks >= METER_MAX_CHUNKS ||
                             (lastChunkMs !== null && (lastChunkMs - firstValidMs) >= METER_MAX_MS);
            if (!metering || windowFull) { stop = true; break; }
          }
        }

        if (stop) {
          finished = true;
          try { await reader.cancel(); } catch (e) { /* ignore */ }
          try { ctrl.abort(); } catch (e) { /* ignore */ }
          break;
        }
      }

      if (streamError) {
        var c3 = classifyHttp(200, JSON.stringify({ error: { message: streamError } }));
        return { status: c3.st, firstTokenMs: null, totalMs: ms(), note: streamError };
      }
      if (firstValidMs !== null) {
        var rr = { status: STATUS.OK, firstTokenMs: firstValidMs, totalMs: ms(),
                   note: metering ? "流式首块正常（测速档）" : "流式首块正常",
                   sample: sample, mode: "流式" };
        if (metering) {
          var span = (lastChunkMs !== null && lastChunkMs > firstValidMs) ? (lastChunkMs - firstValidMs) : 0;
          rr.chunks = outChunks;
          rr.outputChars = outChars;
          rr.outputMs = span || null;
          /* 只收到一块（span=0）就没得算。这里宁可不给速度，也不给一个看起来像
             「0 字/秒」的假值 —— 那会被读成「这个站不吐字」。 */
          rr.cps = (span > 0 && outChars > 0) ? Math.round(outChars / (span / 1000)) : null;
        }
        return rr;
      }
      if (sawJson) return { status: STATUS.WARN, firstTokenMs: null, totalMs: ms(), note: "返回了 JSON 但结构不符合该协议" };
      return { status: STATUS.WARN, firstTokenMs: null, totalMs: ms(), note: "流已结束但没有拿到有效数据块" };

    } catch (err) {
      if (timedOut) return { status: STATUS.TIMEOUT, firstTokenMs: null, totalMs: ms(), note: "超过 " + timeoutMs + "ms 未响应", retryable: true };
      if (finished) return { status: STATUS.OK, firstTokenMs: null, totalMs: ms(), note: "已提前断开（判定成功）" };
      if (err && err.name === "AbortError") return { status: STATUS.TIMEOUT, firstTokenMs: null, totalMs: ms(), note: "请求被中断", retryable: true };
      return { status: STATUS.NETWORK, firstTokenMs: null, totalMs: ms(), note: "无法连接：网络错误或未开放跨域（CORS）", retryable: true };
    } finally {
      clearTimeout(timer);
    }
  }

  async function probeProtocol(nb, p, model, key, timeoutMs, metering) {
    var cands = p.probe(nb, model);
    if (!cands || !cands.length) {
      return { status: STATUS.UNSUPPORTED, firstTokenMs: null, totalMs: 0, note: "未填写自定义地址" };
    }
    var last = null;
    for (var i = 0; i < cands.length; i++) {
      var r = await probeOneUrl(cands[i].url, p, cands[i].body, key, timeoutMs, metering);
      r.url = cands[i].url;
      last = r;
      if (!r.pathMismatch) return r;
    }
    return last;
  }

  async function probeWithRetry(nb, p, model, key, timeoutMs, retries, metering) {
    var attempt = 0, probes = 0, last = null, first = null, waitMs = 0;
    while (attempt <= retries) {
      last = await probeProtocol(nb, p, model, key, timeoutMs, metering);
      probes++;
      if (probes === 1) first = last;
      if (!last.retryable) break;
      attempt++;
      if (attempt <= retries) { var w = 400 * attempt; await sleep(w); waitMs += w; }
    }
    /* 重试成功后返回的是「最后一次」的结果，首次失败那段代价（往往是一整个超时）
       连同退避等待都不在 last.totalMs 里。全部显式带出来：
       别让「首次超时 30s、重试 200ms 成功」在格子里显示成 200ms。 */
    last.attempts = probes;
    last.retried = probes > 1;
    last.retryWaitMs = waitMs;
    last.firstAttemptMs = first ? first.totalMs : null;
    last.firstAttemptLabel = first ? first.status.label : null;
    return last;
  }

  /* 排序后取中位；偶数个样本取中间两个的平均（只取偏小的那个会系统性偏乐观）。
     名字带 Of 是为了不和 renderStats 里那个同名的局部变量撞上。 */
  function medianOf(a) {
    if (!a || !a.length) return null;
    var m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : Math.round((a[m - 1] + a[m]) / 2);
  }

  /* 多轮采样：同一格连打 N 次，延迟取中位、状态取众数。
     单次采样最大的毛病是「抖一下就成结论」—— 和「拿单次 ping 判节点死活」
     是同一种错。默认 N=1，保持原本的零额外消耗；要下结论时再调高。 */
  async function probeSampled(nb, p, model, key, timeoutMs, retries, samples, metering) {
    var runs = [];
    for (var i = 0; i < samples; i++) {
      runs.push(await probeWithRetry(nb, p, model, key, timeoutMs, retries, metering));
      // 别背靠背连着打：那样采到的只是同一个瞬间，多采几次也没意义
      if (i < samples - 1) await sleep(150);
    }
    var base = runs[runs.length - 1];
    base.samples = samples;
    base.passN = runs.filter(function (r) { return r.status.ok; }).length;
    if (samples === 1) return base;

    // 状态取众数；票数相同时取更好的一档（rank 小 = 更可用）
    var tally = {};
    runs.forEach(function (r) {
      if (!tally[r.status.key]) tally[r.status.key] = { n: 0, st: r.status };
      tally[r.status.key].n++;
    });
    var win = null;
    Object.keys(tally).forEach(function (k) {
      var t = tally[k];
      if (!win || t.n > win.n || (t.n === win.n && t.st.rank < win.st.rank)) win = t;
    });

    var lat = runs.map(function (r) { return r.firstTokenMs; })
                  .filter(function (v) { return v != null; })
                  .sort(function (a, b) { return a - b; });
    var cps = runs.map(function (r) { return r.cps; })
                  .filter(function (v) { return v != null; })
                  .sort(function (a, b) { return a - b; });

    var out = Object.assign({}, base);
    out.status = win.st;
    out.firstTokenMs = medianOf(lat);
    out.cps = medianOf(cps);
    out.sampleMs = runs.map(function (r) { return r.firstTokenMs; });
    // 抖动 = 最慢与最快之差。少于两个有效延迟就谈不上抖动，给 null 而不是 0
    out.jitterMs = lat.length >= 2 ? (lat[lat.length - 1] - lat[0]) : null;
    return out;
  }

  /* ==================================================================
     并发池
     ================================================================== */
  async function runPool(items, limit, worker, onProgress) {
    var idx = 0, done = 0, total = items.length;
    var results = new Array(total);
    var width = Math.max(1, Math.min(limit, total));
    async function lane() {
      while (true) {
        var my = idx++;
        if (my >= total) return;
        try { results[my] = await worker(items[my], my); }
        catch (e) {
          results[my] = { status: STATUS.UNKNOWN, firstTokenMs: null, totalMs: 0,
                          note: "内部错误：" + (e && e.message ? e.message : String(e)) };
        }
        done++;
        if (onProgress) onProgress(done, total, results[my]);
      }
    }
    var lanes = [];
    for (var i = 0; i < width; i++) lanes.push(lane());
    await Promise.all(lanes);
    return results;
  }

  /* ==================================================================
     渲染
     ================================================================== */
  function renderProtoGrid() {
    var h = "";
    PROTOCOLS.forEach(function (p) {
      var on = !!state.selected[p.id];
      h += '<div class="proto' + (on ? " on" : "") + '" data-id="' + p.id + '">'
         +   '<div class="p-top"><span class="p-box">' + (on ? "✓" : "") + '</span>'
         +     '<span class="p-name">' + esc(p.name) + '</span>'
         +     '<span class="p-tag">' + esc(p.tag) + '</span></div>'
         +   '<div class="p-path">' + esc(p.path) + '</div>'
         +   '<div class="p-desc">' + esc(p.desc) + '</div>'
         + '</div>';
    });
    protoGrid.innerHTML = h;
    Array.prototype.forEach.call(protoGrid.querySelectorAll(".proto"), function (el) {
      el.addEventListener("click", function () {
        var id = this.getAttribute("data-id");
        state.selected[id] = !state.selected[id];
        renderProtoGrid();
        customWrap.style.display = state.selected["custom"] ? "" : "none";
      });
    });
  }

  function renderConn(html) { connResult.innerHTML = html; }

  function statusBadge(st) { return '<span class="badge ' + st.cls + '">' + st.label + '</span>'; }

  function cellOf(r) {
    if (!r) return '<span class="mcell plain">—</span>';
    var ms = r.firstTokenMs != null ? '<span class="ms">' + r.firstTokenMs + 'ms</span>' : '';
    /* 测速档的吐字速度。矩阵格子很窄，所以只放数字 + /s，口径写到悬停里 */
    var cps = (r.cps != null) ? '<span class="ms cps">' + r.cps + '/s</span>' : '';
    /* 这一格是重试之后才通的：标个 ↻。首次失败的真实代价（往往是一整个超时）
       和退避等待都不在本格延迟里，全部写进悬停说明。 */
    var rt = r.retried ? '<span class="rt">↻</span>' : '';

    var tip = [];
    if (r.samples > 1) {
      tip.push("采样 " + r.samples + " 次，其中 " + r.passN + " 次可用"
        + (r.sampleMs && r.sampleMs.length
            ? "；各次首块 " + r.sampleMs.map(function (v) { return v == null ? "—" : v + "ms"; }).join(" / ")
            : "")
        + (r.jitterMs != null ? "，抖动 " + r.jitterMs + "ms" : "")
        + "；格内取值 = 中位");
    }
    if (r.retried) {
      tip.push("重试 " + (r.attempts - 1) + " 次后才通过：第 1 次为「" + (r.firstAttemptLabel || "失败")
        + "」耗时 " + (r.firstAttemptMs == null ? "—" : r.firstAttemptMs + "ms")
        + "，另有退避 " + r.retryWaitMs + "ms 不计入本格延迟");
    }
    if (r.cps != null) {
      tip.push("吐字速度 " + r.cps + " 字/秒 = 首块之后收到的 " + r.outputChars
        + " 字符 ÷ " + r.outputMs + "ms（共 " + r.chunks + " 个数据块）");
    }
    if (!tip.length) tip.push("点击查看该格明细");

    return '<span class="mcell ' + r.status.cls + '" data-m="' + esc(r.model) + '" data-p="' + esc(r.protoId)
         + '" title="' + esc(tip.join("；")) + '">'
         + esc(r.status.label) + rt + ms + cps + '</span>';
  }

  function renderMatrix() {
    var protos = state.protocols;
    var models = state.order.slice();
    if (state.onlyOk) {
      models = models.filter(function (id) {
        return protos.some(function (p) { var r = state.matrix[id] && state.matrix[id][p.id]; return r && r.status.ok; });
      });
    }
    if (!models.length) { tableWrap.innerHTML = '<div class="hint blank">当前筛选下没有记录。</div>'; legendEl.innerHTML = ""; return; }

    var h = '<div class="matrix-scroll"><table class="matrix"><thead><tr>';
    h += '<th class="mh">模型</th><th>服务端声明</th>';
    protos.forEach(function (p) { h += '<th class="ph">' + esc(p.name) + '</th>'; });
    h += '</tr></thead><tbody>';

    models.forEach(function (id) {
      var m = null;
      for (var i = 0; i < state.models.length; i++) if (state.models[i].id === id) { m = state.models[i]; break; }
      var declared = m && m.declared ? m.declared.join(",") : "—";
      // 声明与实际不符时高亮
      var mismatch = false;
      if (m && m.declared && m.declared.length) {
        protos.forEach(function (p) {
          var r = state.matrix[id] && state.matrix[id][p.id];
          if (!r) return;
          var decl = declaredAllows(m.declared, p.id);
          if (!decl && r.status.ok) mismatch = true;
        });
      }
      h += '<tr><td class="mh">' + esc(id) + '</td>';
      h += '<td><span class="declared' + (mismatch ? " mismatch" : "") + '" title="supported_endpoint_types">' + esc(declared) + '</span></td>';
      protos.forEach(function (p) {
        h += '<td>' + cellOf(state.matrix[id] && state.matrix[id][p.id]) + '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    tableWrap.innerHTML = h;

    // 图例
    var lg = '<span><i style="background:var(--ok)"></i>可用</span>'
           + '<span><i style="background:var(--warn)"></i>降级/超时/限流</span>'
           + '<span><i style="background:var(--err)"></i>失败</span>'
           + '<span><i style="background:var(--neutral)"></i>协议不支持</span>'
           + '<span>点击单元格看明细 · 列宽不够可横向滚动</span>';
    legendEl.innerHTML = lg;

    Array.prototype.forEach.call(tableWrap.querySelectorAll(".mcell[data-m]"), function (el) {
      el.addEventListener("click", function () {
        var mid = this.getAttribute("data-m"), pid = this.getAttribute("data-p");
        var r = state.matrix[mid] && state.matrix[mid][pid];
        if (!r) return;
        var p = null;
        for (var i = 0; i < PROTOCOLS.length; i++) if (PROTOCOLS[i].id === pid) p = PROTOCOLS[i];
        modalTitle.textContent = mid + " · " + (p ? p.name : pid);
        var rows = [
          ["状态", statusBadge(r.status)],
          ["请求地址", '<code class="mono">' + esc(r.url || "—") + '</code>'],
          ["响应方式", esc(r.mode || "—")]
        ];
        /* 计时口径必须跟实现一致：流式命中首个数据块就 abort，那个 totalMs 与首块延迟
           是同一瞬间，拿它当「总耗时」就是虚报。所以流式只报首块延迟，非流式才报总耗时。 */
        if (r.status.ok && r.mode === "流式") {
          rows.push(["首块延迟", r.firstTokenMs == null ? "—" : r.firstTokenMs + " ms"]);
          rows.push(["计时口径", r.cps != null
            ? "流式（测速档）：收满采样窗口后主动断开，故仍不报总耗时；吐字速度见下"
            : "流式：首块延迟即 TTFT；命中首个数据块即断开，故不统计总耗时"]);
        } else if (r.status.ok) {
          rows.push(["响应耗时", r.totalMs == null ? "—" : r.totalMs + " ms"]);
          rows.push(["计时口径", "非流式：完整响应返回的用时"]);
        } else {
          rows.push(["判定用时", r.totalMs == null ? "—" : r.totalMs + " ms"]);
        }
        if (r.cps != null) {
          rows.push(["输出速度", r.cps + " 字/秒"]);
          rows.push(["测速口径", "首块之后收到的 " + r.outputChars + " 字符 ÷ " + r.outputMs
            + " ms（共收 " + r.chunks + " 个数据块）。首块延迟是「等待」、这里是「产出」，两者不相加"]);
        }
        if (r.retried) {
          rows.push(["尝试次数", r.attempts + " 次（重试 " + (r.attempts - 1) + " 次后才通过）"]);
          rows.push(["首次尝试", "「" + esc(r.firstAttemptLabel || "失败") + "」· "
            + (r.firstAttemptMs == null ? "—" : r.firstAttemptMs + " ms")
            + "，另有退避等待 " + r.retryWaitMs + " ms"]);
          rows.push(["说明", "本格延迟取自重试成功的那一次；上面两行是重试前被吞掉的真实代价"]);
        }
        if (r.samples > 1) {
          rows.push(["采样次数", r.samples + " 次（其中 " + r.passN + " 次可用）"]);
          rows.push(["各次首块", (r.sampleMs || []).map(function (v) { return v == null ? "—" : v + " ms"; }).join("　/　")
            + "　→ 格内取中位 " + (r.firstTokenMs == null ? "—" : r.firstTokenMs + " ms")]);
          if (r.jitterMs != null) rows.push(["抖动", r.jitterMs + " ms（最慢 − 最快）"]);
        }
        rows.push(["输出样例", r.sample ? '<code class="mono">' + esc(r.sample) + '</code>' : "—"]);
        rows.push(["备注", esc(r.note || "—")]);
        modalBody.innerHTML = rows.map(function (x) {
          return "<dt>" + x[0] + "</dt><dd>" + x[1] + "</dd>";
        }).join("");
        modal.classList.add("on");
      });
    });
  }

  /* 这轮是怎么测的：采样几次、是不是测速档。数字脱离口径就没法比较。
     默认口径（1 次采样 + 快速档）下不展示 —— 报表面貌保持不变。 */
  function setupLabel() {
    var st = state.probeSetup;
    if (!st) return "未记录";
    return "每格采样 " + st.samples + " 次" + (st.samples > 1 ? "（延迟取中位）" : "")
      + " · " + (st.metering
          ? "测速档（收满 " + st.meterMaxChunks + " 块或 " + (st.meterMaxMs / 1000) + " 秒后断开）"
          : "快速档（命中首个数据块即断开）")
      + " · 并发 " + st.concurrency + " · 超时 " + (st.timeoutMs / 1000) + "s · 重试 " + st.retries + " 次";
  }

  function renderStats() {
    var protos = state.protocols;
    var total = 0, ok = 0, lat = [], spd = [];
    state.order.forEach(function (id) {
      protos.forEach(function (p) {
        var r = state.matrix[id] && state.matrix[id][p.id];
        if (!r) return;
        total++;
        if (r.status.ok) {
          ok++;
          if (r.firstTokenMs != null) lat.push(r.firstTokenMs);
          if (r.cps != null) spd.push(r.cps);
        }
      });
    });
    lat.sort(function (a, b) { return a - b; });
    var median = lat.length ? lat[Math.floor(lat.length / 2)] : null;
    var fastest = lat.length ? lat[0] : null;

    function box(k, v, cls) {
      return '<div class="stat ' + (cls || "") + '"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
    }
    var h = "";
    h += box("模型数", state.order.length);
    h += box("协议数", protos.length);
    h += box("组合总数", total);
    h += box("可用组合", ok, ok > 0 ? "ok" : "");
    h += box("失败组合", total - ok, (total - ok) > 0 ? "err" : "");
    h += box("中位首字延迟", median == null ? "—" : median + " ms");
    /* 测速档才有这个数 —— 快速档不测吞吐，就不显示一个空卡片占位 */
    if (spd.length) h += box("中位输出速度", medianOf(spd) + " 字/秒");
    statsEl.innerHTML = h;
  }

  function setProgress(done, total, label) {
    var pct = total ? Math.round((done / total) * 100) : 0;
    progBar.style.width = pct + "%";
    progCount.textContent = done + " / " + total;
    if (label) progLabel.innerHTML = label;
  }

  /* ==================================================================
     报告
     ================================================================== */
  function buildAnalysis() {
    var protos = state.protocols;
    var models = state.order;

    var protoStats = protos.map(function (p) {
      var pass = 0, fail = 0, lat = [], cps = [], reasons = {};
      models.forEach(function (id) {
        var r = state.matrix[id] && state.matrix[id][p.id];
        if (!r) return;
        if (r.status.ok) {
          pass++;
          if (r.firstTokenMs != null) lat.push(r.firstTokenMs);
          if (r.cps != null) cps.push(r.cps);
        }
        else {
          fail++;
          reasons[r.status.label] = (reasons[r.status.label] || 0) + 1;
        }
      });
      lat.sort(function (a, b) { return a - b; });
      cps.sort(function (a, b) { return a - b; });
      return {
        proto: p, pass: pass, fail: fail, total: pass + fail,
        median: lat.length ? lat[Math.floor(lat.length / 2)] : null,
        fastest: lat.length ? lat[0] : null,
        cps: medianOf(cps),          // 测速档才有值，快速档是 null
        reasons: reasons
      };
    });

    var modelStats = models.map(function (id) {
      var okProtos = [], badProtos = [], decl = null;
      for (var i = 0; i < state.models.length; i++) if (state.models[i].id === id) decl = state.models[i].declared;
      protos.forEach(function (p) {
        var r = state.matrix[id] && state.matrix[id][p.id];
        if (!r) return;
        if (r.status.ok) okProtos.push({ p: p, ms: r.firstTokenMs });
        else badProtos.push({ p: p, st: r.status });
      });
      okProtos.sort(function (a, b) { return (a.ms == null ? 1e9 : a.ms) - (b.ms == null ? 1e9 : b.ms); });
      // 声明与实际的两类偏差分开记录
      var declaredFail = [], extraOk = [];
      protos.forEach(function (p) {
        var r = state.matrix[id] && state.matrix[id][p.id];
        if (!r || !decl || !decl.length) return;
        var declares = declaredAllows(decl, p.id);
        if (declares && !r.status.ok && r.status.key !== "TIMEOUT" && r.status.key !== "RATELIMIT") {
          declaredFail.push(p.id + "（" + r.status.label + "）");
        }
        if (!declares && r.status.ok) extraOk.push(p.id);
      });
      return {
        id: id, declared: decl, okProtos: okProtos, badProtos: badProtos,
        declaredFail: declaredFail, extraOk: extraOk,
        mismatch: declaredFail.map(function (x) { return "声明含 " + x; })
          .concat(extraOk.map(function (x) { return "声明不含 " + x + "，实际可用"; }))
      };
    });

    return { protoStats: protoStats, modelStats: modelStats };
  }

  function renderReport() {
    var an = buildAnalysis();
    var ps = an.protoStats, ms = an.modelStats;
    var h = "";

    // 概览
    var totalCombos = 0, totalOk = 0;
    ps.forEach(function (x) { totalCombos += x.total; totalOk += x.pass; });
    var startStr = state.startedAt ? state.startedAt.toLocaleString("zh-CN") : "—";

    h += '<h3>概览</h3>';
    h += '<table class="plain"><tbody>';
    h += '<tr><td class="lb">站点</td><td><code class="mono">' + esc(state.origin || "") + '</code></td></tr>';
    h += '<tr><td class="lb">测试时间</td><td>' + esc(startStr) + '</td></tr>';
    h += '<tr><td class="lb">模型 / 协议</td><td>' + ms.length + ' 个模型 × ' + ps.length + ' 种协议</td></tr>';
    h += '<tr><td class="lb">可用组合</td><td><b>' + totalOk + ' / ' + totalCombos + '</b></td></tr>';
    h += '<tr><td class="lb">清单来源</td><td><code class="mono">' + esc(state.listSource || "手动清单") + '</code></td></tr>';
    if (state.probeSetup && (state.probeSetup.samples > 1 || state.probeSetup.metering)) {
      h += '<tr><td class="lb">测量口径</td><td>' + esc(setupLabel()) + '</td></tr>';
    }
    h += '</tbody></table>';

    // 各协议通过率
    h += '<h3>各协议通过率</h3><div class="rate-list">';
    ps.forEach(function (x) {
      var pct = x.total ? Math.round((x.pass / x.total) * 100) : 0;
      var color = pct === 100 ? "var(--ok)" : (pct >= 50 ? "var(--warn)" : "var(--err)");
      h += '<div class="rate-row">'
         +   '<span class="rn">' + esc(x.proto.name) + '</span>'
         +   '<span class="rb"><i style="width:' + pct + '%;background:' + color + '"></i></span>'
         +   '<span class="rv">' + x.pass + '/' + x.total + ' · ' + pct + '%</span>'
         + '</div>';
    });
    h += '</div>';

    // 结论
    h += '<h3>结论</h3><ul>';
    var dead = ps.filter(function (x) { return x.pass === 0; });
    var live = ps.filter(function (x) { return x.pass === x.total && x.total > 0; });
    if (dead.length) {
      h += '<li><b>在本站不可用的兼容模式：</b>' + dead.map(function (x) {
        var rs = Object.keys(x.reasons).map(function (k) { return k + "×" + x.reasons[k]; }).join("、");
        return '<code>' + esc(x.proto.id) + '</code>（' + esc(rs) + '）';
      }).join("；") + '</li>';
    }
    if (live.length) {
      h += '<li><b>全部模型都通过的协议：</b>' + live.map(function (x) { return '<code>' + esc(x.proto.id) + '</code>'; }).join("、") + '</li>';
    }
    var partial = ps.filter(function (x) { return x.pass > 0 && x.pass < x.total; });
    if (partial.length) {
      h += '<li><b>部分模型才通过的协议（存在模型级差异）：</b>' + partial.map(function (x) {
        return '<code>' + esc(x.proto.id) + '</code>（' + x.pass + '/' + x.total + '）';
      }).join("、") + '</li>';
    }

    // 单协议孤儿模型
    var orphans = ms.filter(function (x) { return x.okProtos.length === 0; });
    if (orphans.length) {
      h += '<li><b>所有选中协议下都不可用的模型：</b>' + orphans.map(function (x) { return '<code>' + esc(x.id) + '</code>'; }).join("、") + '</li>';
    }

    // 声明与实际不符 —— 最有价值的发现，分两类呈现
    var declaredFails = ms.filter(function (x) { return x.declaredFail.length; });
    var extras = ms.filter(function (x) { return x.extraOk.length; });
    if (declaredFails.length) {
      h += '<li><b>服务端声明支持、实测却不可用（需要关注）：</b><br>' + declaredFails.map(function (x) {
        return '<code>' + esc(x.id) + '</code>（声明 ' + esc((x.declared || []).join(",")) + '）→ ' + x.declaredFail.map(esc).join("；");
      }).join("<br>") + '</li>';
    }
    if (extras.length) {
      var exSample = extras.slice(0, 4).map(function (x) {
        return '<code>' + esc(x.id) + '</code> +' + x.extraOk.join("/");
      }).join("、");
      h += '<li><b>服务端未声明、实测却可用（可放宽映射）：</b>共 ' + extras.length + ' 个模型，例如 ' + exSample
         + (extras.length > 4 ? ' 等' : '') + '。说明该站会把请求转成上游协议，声明清单偏保守。</li>';
    }
    if (!declaredFails.length && !extras.length) {
      h += '<li>服务端声明的协议支持与实际行为一致，未发现偏差。</li>';
    }

    // 推荐
    var best = ps.filter(function (x) { return x.pass > 0; }).sort(function (a, b) {
      if (b.pass !== a.pass) return b.pass - a.pass;
      return (a.median == null ? 1e9 : a.median) - (b.median == null ? 1e9 : b.median);
    })[0];
    if (best) {
      h += '<li><b>推荐首选协议：</b><code>' + esc(best.proto.id) + '</code>（' + esc(best.proto.name) + '，通过 '
         + best.pass + '/' + best.total + (best.median != null ? '，中位首字延迟 ' + best.median + 'ms' : '') + '）</li>';
    }
    h += '</ul>';

    // 模型明细
    h += '<h3>逐模型明细</h3>';
    h += '<table class="plain"><thead><tr><th>模型</th><th>服务端声明</th><th>可用协议</th><th>最快</th><th>失败协议</th></tr></thead><tbody>';
    ms.forEach(function (x) {
      var okTxt = x.okProtos.length ? x.okProtos.map(function (o) { return esc(o.p.id); }).join("、") : '<span class="note bad">无</span>';
      var badTxt = x.badProtos.length
        ? x.badProtos.map(function (o) { return esc(o.p.id) + '<span class="note">(' + esc(o.st.label) + ')</span>'; }).join(" ")
        : '<span class="note">—</span>';
      var bestMs = x.okProtos.length && x.okProtos[0].ms != null ? x.okProtos[0].ms + " ms" : "—";
      h += '<tr>'
         + '<td class="model-name">' + esc(x.id) + '</td>'
         + '<td class="note">' + esc((x.declared || []).join(", ") || "—") + '</td>'
         + '<td class="note">' + okTxt + '</td>'
         + '<td class="num">' + bestMs + '</td>'
         + '<td class="note">' + badTxt + '</td>'
         + '</tr>';
    });
    h += '</tbody></table>';

    // 失败明细
    var failRows = [];
    ms.forEach(function (x) {
      x.badProtos.forEach(function (o) {
        var r = state.matrix[x.id][o.p.id];
        failRows.push({ model: x.id, pid: o.p.id, st: o.st, note: r.note || "" });
      });
    });
    if (failRows.length) {
      h += '<h3>失败明细（' + failRows.length + ' 条）</h3>';
      h += '<table class="plain"><thead><tr><th>模型</th><th>协议</th><th>状态</th><th>原因</th></tr></thead><tbody>';
      failRows.forEach(function (f) {
        h += '<tr><td class="model-name">' + esc(f.model) + '</td><td class="note">' + esc(f.pid) + '</td>'
           + '<td>' + statusBadge(f.st) + '</td><td class="note">' + esc(f.note) + '</td></tr>';
      });
      h += '</tbody></table>';
      h += '<div class="hint mid">提示：「超时」「限流」多为上游偶发，建议点上方「重测失败项」再下结论；'
         + '「协议不支持」是稳定的路径级结论，重测意义不大。</div>';
    }

    reportBody.innerHTML = h;
    panelReport.style.display = "";
    reportActions.style.display = "flex";
  }

  /* ==================================================================
     主流程
     ================================================================== */
  async function run() {
    if (state.running) return;

    var nb = normalizeBase(elBaseUrl.value);
    var key = elApiKey.value.trim();
    var timeoutMs = Math.max(5, Number(elTimeout.value) || 30) * 1000;
    var retries = Math.max(0, Number(elRetries.value) || 0);
    var concurrency = Math.max(1, Math.min(20, Number(elConcurrency.value) || 6));
    /* 采样与测速来自地址栏参数（页面上没有这两个控件），默认 1 次 / 快速档 */
    var samples = probeSettings.samples;
    var metering = probeSettings.metering;

    if (!nb) { alert("接口地址格式不正确。请填写完整地址，例如 https://api.example.com/v1（需以 http:// 或 https:// 开头）"); elBaseUrl.focus(); return; }
    if (!key) { alert("请先填写 API Key"); elApiKey.focus(); return; }

    var protos = PROTOCOLS.filter(function (p) { return state.selected[p.id]; });
    if (!protos.length) { alert("请至少选择一种兼容模式"); return; }
    if (state.selected["custom"] && !elCustomUrl.value.trim()) {
      alert("选择了「自定义协议」，请填写完整地址"); elCustomUrl.focus(); return;
    }

    saveConfig();

    state.running = true;
    state.origin = nb.origin;
    cspBlocked.length = 0;
    state.protocols = protos;
    state.probeSetup = {
      samples: samples,
      metering: metering,
      concurrency: concurrency,
      timeoutMs: timeoutMs,
      retries: retries,
      meterMaxChunks: metering ? METER_MAX_CHUNKS : null,
      meterMaxMs: metering ? METER_MAX_MS : null
    };
    state.matrix = {};
    state.order = [];
    state.models = [];
    state.onlyOk = false;
    state.startedAt = new Date();
    elRunBtn.disabled = true;
    elRunBtn.textContent = "测试中…";

    panelConn.style.display = "";
    panelModels.style.display = "";
    panelReport.style.display = "none";
    resultActions.style.display = "none";
    renderConn('<div class="banner info"><span class="ico">●</span><div>正在探测模型清单端点<span class="dots"></span></div></div>');
    statsEl.innerHTML = "";
    tableWrap.innerHTML = "";
    legendEl.innerHTML = "";
    reportBody.innerHTML = "";
    setProgress(0, 0, "准备中<span class=\"dots\"></span>");

    try {
      /* ---- 阶段一：清单 ---- */
      var manualList = null;
      if (elManual.checked) {
        manualList = elManualModels.value.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean)
                     .map(function (s) { return { id: s, declared: null }; });
        if (!manualList.length) {
          renderConn('<div class="banner err"><span class="ico">✕</span><div>已勾选手动模式，但清单为空。请每行填写一个模型名。</div></div>');
          finishRun(); return;
        }
      }

      var listRes = manualList ? { ok: true, models: manualList, source: null } : await fetchModelList(nb, key, timeoutMs);

      if (!listRes.ok) {
        var st = listRes.status;
        var extra = "";
        if (st.key === "NETWORK") {
          var tried = (listRes.fails || []).map(function (f) { return f.url; });
          var d = await diagnoseConn(nb, tried[0] || (nb.roots[0] + "/models"), timeoutMs);
          extra = '<br><br><b>判定：' + d.title + '</b><br>' + d.detail
                + '<br><br>建议：<br>'
                + d.fix.map(function (s, i) { return (i + 1) + ". " + s; }).join("<br>")
                + (tried.length
                   ? '<div class="hint mid">已尝试：' + tried.slice(0, 3).map(function (u) {
                       return '<code>' + esc(u) + '</code>';
                     }).join("、") + (tried.length > 3 ? " 等 " + tried.length + " 个端点" : "") + '</div>'
                   : '');
        } else if (st.key === "UNAUTH") {
          extra = '<br><br>接口可达，但 Key 被拒绝。请确认 Key 未过期、未被禁用。';
        } else {
          extra = '<br><br>未能从该站点拉到模型清单。可在高级设置里改用「手动指定模型清单」。';
        }
        renderConn('<div class="banner err"><span class="ico">✕</span><div><b>未能获取模型清单（' + esc(st.label) + '）</b><br>'
                 + esc(listRes.note) + extra + '</div></div>');
        finishRun(); return;
      }

      state.models = listRes.models;
      state.listSource = listRes.source || "手动清单";
      state.order = state.models.map(function (m) { return m.id; });

      var declaredCount = state.models.filter(function (m) { return m.declared && m.declared.length; }).length;
      renderConn('<div class="banner ok"><span class="ico">✓</span><div><b>连接成功，发现 ' + state.models.length + ' 个可见模型。</b>'
               + '<br>清单来源：<code>' + esc(state.listSource) + '</code>'
               + (declaredCount ? '<br>其中 ' + declaredCount + ' 个模型带服务端协议声明（supported_endpoint_types）' : '')
               + '<br>即将按 ' + protos.length + ' 种协议交叉实测…</div></div>');

      /* ---- 阶段二：矩阵 ---- */
      var tasks = [];
      var skipped = 0;
      var filterOn = elFilterDeclared.checked;
      state.models.forEach(function (m) {
        protos.forEach(function (p) {
          if (filterOn && !declaredAllows(m.declared, p.id)) { skipped++; return; }
          tasks.push({ model: m.id, proto: p });
        });
      });

      if (!tasks.length) {
        renderConn('<div class="banner warn"><span class="ico">!</span><div>按「服务端声明」过滤后没有需要测试的组合。请取消该选项。</div></div>');
        finishRun(); return;
      }

      setProgress(0, tasks.length, "交叉实测中<span class=\"dots\"></span>");

      await runPool(
        tasks,
        concurrency,
        function (t) {
          return probeSampled(nb, t.proto, t.model, key, timeoutMs, retries, samples, metering).then(function (r) {
            r.model = t.model;
            r.protoId = t.proto.id;
            return r;
          });
        },
        function (done, total, one) {
          if (one && one.model && one.protoId) {
            if (!state.matrix[one.model]) state.matrix[one.model] = {};
            state.matrix[one.model][one.protoId] = one;
          }
          setProgress(done, total, "交叉实测中<span class=\"dots\"></span>");
          renderStats();
          renderMatrix();
        }
      );

      setProgress(tasks.length, tasks.length, "完成");
      renderStats();
      renderMatrix();
      resultActions.style.display = "flex";

      var okCount = 0, retryCount = 0, retryOnly = 0, unstable = 0;
      Object.keys(state.matrix).forEach(function (m) {
        Object.keys(state.matrix[m]).forEach(function (p) {
          var r = state.matrix[m][p];
          if (r.status.ok) okCount++;
          if (r.retried) { retryCount++; if (r.status.ok) retryOnly++; }
          /* 几次采样之间「结论对不上」的格子：状态时好时坏，或延迟抖得明显。
             这正是单次采样会给出错误答案的地方，单独报个数出来。 */
          if (r.samples > 1 &&
              ((r.passN > 0 && r.passN < r.samples) || (r.jitterMs != null && r.jitterMs > 0))) unstable++;
        });
      });
      var msg = '<div class="banner ' + (okCount === tasks.length ? "ok" : (okCount ? "warn" : "err")) + '">'
              + '<span class="ico">' + (okCount === tasks.length ? "✓" : (okCount ? "!" : "✕")) + '</span><div>'
              + '<b>实测完成：' + tasks.length + ' 个「模型 × 协议」组合中 ' + okCount + ' 个可用。</b>'
              + (retryCount
                  ? '<br>其中 <b>' + retryOnly + ' 个可用组合是重试之后才通过的</b>（矩阵里带 ↻ 标记），'
                    + '首次尝试的耗时没有计入格子里的延迟，点开可看真实代价。'
                  : '')
              + (samples > 1
                  ? '<br>每格采样 <b>' + samples + ' 次</b>、延迟取中位；'
                    + (unstable
                        ? '其中 <b>' + unstable + ' 个组合几次结果对不上</b>（状态时好时坏或延迟抖动），建议点开核对。'
                        : '本次各格结果稳定，没有出现几次对不上的情况。')
                  : '')
              + (metering
                  ? '<br>测速档：每格收满 ' + METER_MAX_CHUNKS + ' 个数据块或 ' + (METER_MAX_MS / 1000)
                    + ' 秒后断开；输出速度按「首块之后」的净产出来算，与首块延迟不相加。'
                  : '')
              + (skipped ? '<br>已按服务端声明过滤掉 ' + skipped + ' 个组合。' : '')
              + (okCount < tasks.length ? '<br>失败项多为上游偶发，建议先点「重测失败项」再下结论。' : '')
              + '</div></div>';
      renderConn(msg);

      renderReport();
      state.finishedAt = new Date();

    } catch (e) {
      renderConn('<div class="banner err"><span class="ico">✕</span><div>执行出错：' + esc(e && e.message ? e.message : String(e)) + '</div></div>');
    } finally {
      finishRun();
    }
  }

  function finishRun() {
    state.running = false;
    elRunBtn.disabled = false;
    elRunBtn.textContent = "开始测试";
  }

  /* ==================================================================
     重测失败项
     ================================================================== */
  async function retestFailed() {
    if (state.running || !state.protocols.length) return;
    var nb = normalizeBase(elBaseUrl.value);
    var tasks = [];
    state.order.forEach(function (id) {
      state.protocols.forEach(function (p) {
        var r = state.matrix[id] && state.matrix[id][p.id];
        if (r && !r.status.ok && r.status.key !== "UNSUPPORTED") tasks.push({ model: id, proto: p });
      });
    });
    if (!tasks.length) { alert("没有可重测的失败项（「协议不支持」属于稳定结论，已跳过）。"); return; }

    var key = elApiKey.value.trim();
    var timeoutMs = Math.max(5, Number(elTimeout.value) || 30) * 1000;
    var retries = Math.max(0, Number(elRetries.value) || 0);
    var concurrency = Math.max(1, Math.min(20, Number(elConcurrency.value) || 6));
    var samples = probeSettings.samples;
    var metering = probeSettings.metering;

    state.running = true;
    elRunBtn.disabled = true;
    setProgress(0, tasks.length, "重测失败项<span class=\"dots\"></span>");

    await runPool(tasks, concurrency, function (t) {
      return probeSampled(nb, t.proto, t.model, key, timeoutMs, retries, samples, metering).then(function (r) {
        r.model = t.model; r.protoId = t.proto.id; return r;
      });
    }, function (done, total, one) {
      state.matrix[one.model][one.protoId] = one;
      setProgress(done, total, "重测失败项<span class=\"dots\"></span>");
      renderStats(); renderMatrix();
    });

    setProgress(tasks.length, tasks.length, "重测完成");
    renderStats(); renderMatrix(); renderReport();
    state.running = false;
    elRunBtn.disabled = false;
  }

  /* ==================================================================
     导出
     ================================================================== */
  function download(filename, content, mime) {
    var blob = new Blob([content], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  function stamp() {
    var d = state.startedAt || new Date();
    function p(n) { return n < 10 ? "0" + n : "" + n; }
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }

  function maskKey(k) {
    if (!k) return "";
    if (k.length <= 12) return k.slice(0, 4) + "***";
    return k.slice(0, 8) + "…" + k.slice(-4);
  }

  function expCsv() {
    var protos = state.protocols;
    var rows = [["模型", "服务端声明"].concat(protos.map(function (p) { return p.id; })).concat(["可用协议数", "最快延迟ms"])];
    state.order.forEach(function (id) {
      var m = null;
      for (var i = 0; i < state.models.length; i++) if (state.models[i].id === id) m = state.models[i];
      var cells = [id, (m && m.declared ? m.declared.join("|") : "")];
      var okN = 0, best = null;
      protos.forEach(function (p) {
        var r = state.matrix[id] && state.matrix[id][p.id];
        cells.push(r ? (r.status.label + (r.firstTokenMs != null ? " " + r.firstTokenMs + "ms" : "")) : "");
        if (r && r.status.ok) { okN++; if (r.firstTokenMs != null && (best == null || r.firstTokenMs < best)) best = r.firstTokenMs; }
      });
      cells.push(okN, best == null ? "" : best);
      rows.push(cells);
    });
    var csv = rows.map(function (r) {
      return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\r\n");
    download("model-compat-" + stamp() + ".csv", "\ufeff" + csv, "text/csv;charset=utf-8");
  }

  function exportPayload() {
    return {
      generatedAt: new Date().toISOString(),
      startedAt: state.startedAt ? state.startedAt.toISOString() : null,
      site: state.origin,
      listSource: state.listSource,
      /* 这轮是怎么测的：采样几次、是不是测速档。数字脱离口径就没法比较，
         报告发给别人时对方得知道「605ms 是 1 次的还是 3 次的中位」。 */
      setup: state.probeSetup || null,
      protocols: state.protocols.map(function (p) { return { id: p.id, name: p.name, path: p.path }; }),
      models: state.models.map(function (m) { return { id: m.id, declared: m.declared }; }),
      matrix: state.order.map(function (id) {
        var row = { model: id };
        state.protocols.forEach(function (p) {
          var r = state.matrix[id] && state.matrix[id][p.id];
          row[p.id] = r ? {
            status: r.status.key, label: r.status.label,
            firstTokenMs: r.firstTokenMs,
            /* elapsedMs = 最后一次尝试「从发出到判定」的用时。
               流式成功时它等于 firstTokenMs（命中首个数据块就断开），不是总耗时；
               具体口径看 timingScope。原来这个字段叫 totalMs，名不副实，已改名。 */
            elapsedMs: r.totalMs,
            timingScope: (r.status.ok && r.mode === "流式") ? "stream-first-chunk"
                       : (r.status.ok ? "non-stream-full" : "until-failure"),
            attempts: r.attempts || 1,
            retried: !!r.retried,
            retryWaitMs: r.retryWaitMs || 0,
            firstAttemptMs: r.firstAttemptMs == null ? null : r.firstAttemptMs,
            firstAttemptLabel: r.firstAttemptLabel || null,
            /* 多轮采样的痕迹：sampleMs 是每一次的首块延迟，格内值取其中位。
               两头的差值 jitterMs 就是这一格的抖动幅度 —— 只有单次采样时给 null，
               因为「一个点」谈不上抖动，给 0 会被误读成「测过，很稳」。 */
            samples: r.samples || 1,
            passN: r.passN == null ? null : r.passN,
            sampleMs: r.sampleMs || null,
            jitterMs: r.jitterMs == null ? null : r.jitterMs,
            /* 测速档才有：cps = 首块之后净吐字速度（字符/秒） */
            cps: r.cps == null ? null : r.cps,
            outputChars: r.outputChars == null ? null : r.outputChars,
            outputMs: r.outputMs == null ? null : r.outputMs,
            chunks: r.chunks == null ? null : r.chunks
          } : null;
        });
        return row;
      })
    };
  }

  function expJson() {
    download("model-compat-" + stamp() + ".json", JSON.stringify(exportPayload(), null, 2), "application/json");
  }

  function buildMarkdown() {
    var an = buildAnalysis();
    var ps = an.protoStats, ms = an.modelStats;
    var L = [];
    L.push("# 模型接口兼容性测试报告");
    L.push("");
    L.push("- **站点**：" + (state.origin || ""));
    L.push("- **Key**：" + maskKey(elApiKey.value.trim()));
    L.push("- **测试时间**：" + (state.startedAt ? state.startedAt.toLocaleString("zh-CN") : ""));
    L.push("- **清单来源**：" + (state.listSource || "手动清单"));
    /* 默认口径（1 次采样 + 快速档）下不写这一行，报告与页面上看到的保持一致 */
    if (state.probeSetup && (state.probeSetup.samples > 1 || state.probeSetup.metering)) {
      L.push("- **测量口径**：" + setupLabel());
    }
    L.push("- **规模**：" + ms.length + " 个模型 × " + ps.length + " 种协议");
    L.push("");
    L.push("## 各协议通过率");
    L.push("");
    /* 快速档拿不到吞吐，就别在表里挂一列全是「—」 */
    var withSpeed = ps.some(function (x) { return x.cps != null; });
    L.push("| 协议 | 端点 | 通过 | 通过率 | 中位首字延迟 |" + (withSpeed ? " 中位输出速度 |" : ""));
    L.push("|---|---|---|---|---|" + (withSpeed ? "---|" : ""));
    ps.forEach(function (x) {
      var pct = x.total ? Math.round((x.pass / x.total) * 100) : 0;
      L.push("| " + x.proto.name + " | `" + x.proto.path + "` | " + x.pass + "/" + x.total + " | " + pct + "% | "
           + (x.median == null ? "—" : x.median + " ms") + " |"
           + (withSpeed ? " " + (x.cps == null ? "—" : x.cps + " 字/秒") + " |" : ""));
    });
    L.push("");
    L.push("## 模型 × 协议 矩阵");
    L.push("");
    L.push("| 模型 | 声明 | " + state.protocols.map(function (p) { return p.id; }).join(" | ") + " |");
    L.push("|---|---|" + state.protocols.map(function () { return "---"; }).join("|") + "|");
    state.order.forEach(function (id) {
      var m = null;
      for (var i = 0; i < state.models.length; i++) if (state.models[i].id === id) m = state.models[i];
      var cells = state.protocols.map(function (p) {
        var r = state.matrix[id] && state.matrix[id][p.id];
        if (!r) return "—";
        return r.status.ok ? (r.firstTokenMs != null ? r.firstTokenMs + "ms" : "可用") : (r.status.label);
      });
      L.push("| `" + id + "` | " + ((m && m.declared) ? m.declared.join(",") : "—") + " | " + cells.join(" | ") + " |");
    });
    L.push("");
    L.push("## 结论");
    L.push("");
    ps.forEach(function (x) {
      var pct = x.total ? Math.round((x.pass / x.total) * 100) : 0;
      var mark = pct === 100 ? "全部通过" : (pct === 0 ? "完全不可用" : "部分可用");
      L.push("- **" + x.proto.name + "**（`" + x.proto.id + "`）：" + mark
           + " —— " + x.pass + "/" + x.total
           + (Object.keys(x.reasons).length ? "（" + Object.keys(x.reasons).map(function (k) { return k + "×" + x.reasons[k]; }).join("、") + "）" : ""));
    });
    L.push("");
    var declaredFails = ms.filter(function (x) { return x.declaredFail.length; });
    var extras = ms.filter(function (x) { return x.extraOk.length; });
    if (declaredFails.length) {
      L.push("### 声明支持但实测不可用（需要关注）");
      L.push("");
      declaredFails.forEach(function (x) {
        L.push("- `" + x.id + "`（声明 " + ((x.declared || []).join(",") || "—") + "）→ " + x.declaredFail.join("；"));
      });
      L.push("");
    }
    if (extras.length) {
      L.push("### 未声明但实测可用（可放宽映射）");
      L.push("");
      L.push("共 " + extras.length + " 个模型："
        + extras.map(function (x) { return "`" + x.id + "` +" + x.extraOk.join("/"); }).join("、"));
      L.push("");
    }
    var failRows = [];
    ms.forEach(function (x) {
      x.badProtos.forEach(function (o) {
        var r = state.matrix[x.id][o.p.id];
        failRows.push("| `" + x.id + "` | " + o.p.id + " | " + o.st.label + " | " + String(r.note || "").replace(/\|/g, "\\|") + " |");
      });
    });
    if (failRows.length) {
      L.push("## 失败明细");
      L.push("");
      L.push("| 模型 | 协议 | 状态 | 原因 |");
      L.push("|---|---|---|---|");
      L.push.apply(L, failRows);
      L.push("");
    }
    return L.join("\n");
  }

       + "</div>";

      h += "<tr><td><b>" + esc(x.proto.name) + "</b><br><code>" + esc(x.proto.id) + "</code></td>"

    });
    h += "</tbody></table>";

    h += "<h2>模型 × 协议 矩阵</h2><table><thead><tr><th>模型</th><th>服务端声明</th>";
    state.protocols.forEach(function (p) { h += "<th>" + esc(p.id) + "</th>"; });
    h += "</tr></thead><tbody>";
    state.order.forEach(function (id) {
      var m = null;
      for (var i = 0; i < state.models.length; i++) if (state.models[i].id === id) m = state.models[i];
      h += "<tr><td><code>" + esc(id) + "</code></td><td class=\"na\">" + esc((m && m.declared) ? m.declared.join(",") : "—") + "</td>";
      state.protocols.forEach(function (p) {
        var r = state.matrix[id] && state.matrix[id][p.id];
        if (!r) { h += "<td class=\"na\">—</td>"; return; }
        var mark = r.retried ? " <span title=\"重试 " + (r.attempts - 1) + " 次后才通过；第 1 次为「"
          + esc(r.firstAttemptLabel || "失败") + "」耗时 " + (r.firstAttemptMs == null ? "—" : r.firstAttemptMs + "ms")
          + "\">↻</span>" : "";
        if (r.status.ok) h += "<td class=\"ok\">" + (r.firstTokenMs != null ? r.firstTokenMs + "ms" : "可用") + mark + "</td>";
        else {
          var cls = r.status.key === "UNSUPPORTED" ? "na" : (r.status.cls === "warn" ? "warn" : "bad");
          h += "<td class=\"" + cls + "\">" + esc(r.status.label) + mark + "</td>";
        }
      });
      h += "</tr>";
    });
    h += "</tbody></table>";

    h += "<h2>结论</h2><ul>";
    var dead = ps.filter(function (x) { return x.pass === 0; });
    var live = ps.filter(function (x) { return x.pass === x.total && x.total > 0; });
    var partial = ps.filter(function (x) { return x.pass > 0 && x.pass < x.total; });
    if (live.length) h += "<li><b>全部模型可用：</b>" + live.map(function (x) { return "<code>" + esc(x.proto.id) + "</code>"; }).join("、") + "</li>";
    if (partial.length) h += "<li><b>存在模型级差异（部分可用）：</b>" + partial.map(function (x) {
      return "<code>" + esc(x.proto.id) + "</code>（" + x.pass + "/" + x.total + "）"; }).join("、") + "</li>";
    if (dead.length) h += "<li><b>本站不可用：</b>" + dead.map(function (x) {
      var rs = Object.keys(x.reasons).map(function (k) { return k + "×" + x.reasons[k]; }).join("、");
      return "<code>" + esc(x.proto.id) + "</code>（" + esc(rs) + "）"; }).join("；") + "</li>";
    var declaredFails = ms.filter(function (x) { return x.declaredFail.length; });
    if (declaredFails.length) {
      h += "<li><b>声明支持但实测不可用：</b><br>" + declaredFails.map(function (x) {
        return "<code>" + esc(x.id) + "</code>（声明 " + esc((x.declared || []).join(",")) + "）→ " + x.declaredFail.map(esc).join("；");
      }).join("<br>") + "</li>";
    }
    var extras2 = ms.filter(function (x) { return x.extraOk.length; });
    if (extras2.length) {
      h += "<li><b>未声明但实测可用：</b>共 " + extras2.length + " 个模型，例如 "
        + extras2.slice(0, 4).map(function (x) { return "<code>" + esc(x.id) + "</code> +" + esc(x.extraOk.join("/")); }).join("、") + "</li>";
    }
    var best = ps.filter(function (x) { return x.pass > 0; }).sort(function (a, b) {
      if (b.pass !== a.pass) return b.pass - a.pass;
      return (a.median == null ? 1e9 : a.median) - (b.median == null ? 1e9 : b.median);
    })[0];
    if (best) h += "<li><b>推荐首选：</b><code>" + esc(best.proto.id) + "</code>（" + esc(best.proto.name) + "，"
                + best.pass + "/" + best.total + (best.median != null ? "，中位 " + best.median + "ms" : "") + "）</li>";
    h += "</ul>";

    var failRows = [];
    ms.forEach(function (x) {
      x.badProtos.forEach(function (o) {
        var r = state.matrix[x.id][o.p.id];
        failRows.push("<tr><td><code>" + esc(x.id) + "</code></td><td><code>" + esc(o.p.id) + "</code></td><td>"
                    + esc(o.st.label) + "</td><td>" + esc(r.note || "") + "</td></tr>");
      });
    });
    if (failRows.length) {
      h += "<h2>失败明细（" + failRows.length + "）</h2><table><thead><tr><th>模型</th><th>协议</th><th>状态</th><th>原因</th></tr></thead><tbody>"
         + failRows.join("") + "</tbody></table>";
    }

    h += "<footer>由「模型接口兼容性测试」生成 · Key 仅用于本地请求，未上传任何服务器</footer></body></html>";
    download("model-compat-report-" + stamp() + ".html", h, "text/html;charset=utf-8");
  }

  /* ==================================================================
     配置持久化
     ================================================================== */
  function saveConfig() {
    try {
      var cfg = {
        baseUrl: elBaseUrl.value.trim(),
        concurrency: elConcurrency.value, timeout: elTimeout.value, retries: elRetries.value,
        remember: elRemember.checked, filterDeclared: elFilterDeclared.checked,
        selected: state.selected, customUrl: elCustomUrl.value.trim()
      };
      if (elRemember.checked) cfg.apiKey = elApiKey.value.trim();
      localStorage.setItem(LS_KEY, JSON.stringify(cfg));
    } catch (e) { /* ignore */ }
  }

  function loadConfig() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      var cfg = JSON.parse(raw);
      if (cfg.baseUrl) elBaseUrl.value = cfg.baseUrl;
      if (cfg.concurrency) elConcurrency.value = cfg.concurrency;
      if (cfg.timeout) elTimeout.value = cfg.timeout;
      if (cfg.retries != null) elRetries.value = cfg.retries;
      if (cfg.filterDeclared) elFilterDeclared.checked = true;
      if (cfg.customUrl) elCustomUrl.value = cfg.customUrl;
      if (cfg.selected) state.selected = cfg.selected;
      if (cfg.remember) {
        elRemember.checked = true;
        if (cfg.apiKey) elApiKey.value = cfg.apiKey;
      }
    } catch (e) { /* ignore */ }
  }

  /* ==================================================================
     事件绑定
     ================================================================== */
  elKeyToggle.addEventListener("click", function () {
    var isPwd = elApiKey.type === "password";
    elApiKey.type = isPwd ? "text" : "password";
    elKeyToggle.textContent = isPwd ? "隐藏" : "显示";
  });

  elManual.addEventListener("change", function () {
    elManualWrap.style.display = elManual.checked ? "" : "none";
  });

  $("pMain").addEventListener("click", function () {
    state.selected = { "openai": true, "anthropic": true, "openai-response": true };
    renderProtoGrid(); customWrap.style.display = "none";
  });
  $("pAll").addEventListener("click", function () {
    PROTOCOLS.forEach(function (p) { state.selected[p.id] = true; });
    renderProtoGrid(); customWrap.style.display = "";
  });
  $("pNone").addEventListener("click", function () {
    PROTOCOLS.forEach(function (p) { state.selected[p.id] = false; });
    renderProtoGrid(); customWrap.style.display = "none";
  });

  elRunBtn.addEventListener("click", run);
  $("expHtml").addEventListener("click", expHtmlReport);
  $("expMd").addEventListener("click", expMd);
  $("expJson").addEventListener("click", expJson);
  $("expCsv").addEventListener("click", expCsv);
  $("retestFail").addEventListener("click", retestFailed);
  $("onlyOk").addEventListener("click", function () {
    state.onlyOk = !state.onlyOk;
    this.textContent = state.onlyOk ? "显示全部" : "只看可用协议";
    renderMatrix();
  });
  $("modalClose").addEventListener("click", function () { modal.classList.remove("on"); });
  modal.addEventListener("click", function (e) { if (e.target === modal) modal.classList.remove("on"); });

  [elBaseUrl, elApiKey].forEach(function (el) {
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); run(); }
    });
  });

  renderProtoGrid();
  loadConfig();
  renderProtoGrid();
  customWrap.style.display = state.selected["custom"] ? "" : "none";

  /* 暴露给自动化测试 */
  window.__MAT__ = {
    normalizeBase: normalizeBase,
    hostKind: hostKind,
    pageIsLocal: pageIsLocal,
    cspBlocked: cspBlocked,
    diagnoseConn: diagnoseConn,
    classifyHttp: classifyHttp,
    extractErrorMessage: extractErrorMessage,
    parseModelList: parseModelList,
    isHtmlBody: isHtmlBody,
    declaredAllows: declaredAllows,
    PROTOCOLS: PROTOCOLS,
    state: state,
    buildMarkdown: buildMarkdown,
    exportPayload: exportPayload,
    /* 采样 / 测速：页面上没有开关，自测里直接改这个对象 */
    probeSettings: probeSettings,
    probeSampled: probeSampled,
    probeWithRetry: probeWithRetry,
    cellOf: cellOf,
    medianOf: medianOf,
    setupLabel: setupLabel
  };
})();
</script>
</body>
</html>
